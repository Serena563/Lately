<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kasboek</title>
<meta name="theme-color" content="#171B22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: één kolom, tabbladen bovenaan, kaarten alleen waar iets apart moet staan; cijfers in mono */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#1E2430; --muted:#626B7A; --line:#E3E6EC;
  --accent:#3E5CA8; --accent-soft:#E8EDF8; --in:#2C7A50; --out:#B24A5B; --out-soft:#F7E6E9; --warn:#8C620F; --warn-soft:#F6EEDC;
  --f-display:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-num:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171B22; --surface:#1F242D; --ink:#ECE9E3; --muted:#A0A6B0; --line:#2D333D;
  --accent:#9DB3E8; --accent-soft:#27304A; --in:#8FCBA0; --out:#E79DA7; --out-soft:#3A262B; --warn:#E6C07A; --warn-soft:#3A3122; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171B22; --surface:#1F242D; --ink:#ECE9E3; --muted:#A0A6B0; --line:#2D333D;
  --accent:#9DB3E8; --accent-soft:#27304A; --in:#8FCBA0; --out:#E79DA7; --out-soft:#3A262B; --warn:#E6C07A; --warn-soft:#3A3122; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:18px 90px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;letter-spacing:-.02em;margin:0;line-height:1}
h2{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:0;text-wrap:balance}
h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)}
button,.btn{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:500;text-decoration:none;display:inline-block}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn-danger{border-color:var(--out);color:var(--out)}
.btn-small{padding:4px 10px;font-size:.85rem}
.btn-link{border:none;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;font-family:var(--f-num);font-size:.78rem;min-height:110px}
input[type=file]{display:none}
nav.tabs{display:flex;gap:2px;margin:18px 0 14px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{border:none;border-radius:0;background:none;padding:10px 11px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.banner b{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .label{font-family:var(--f-display);font-weight:600;font-size:1.15rem;min-width:9.5em;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat .v{font-family:var(--f-num);font-size:1.12rem;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.alerts{display:flex;flex-direction:column;gap:0;padding:4px 16px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:none;border-right:none;border-top:none;border-radius:0;text-align:left;width:100%;font-weight:400}
.alert:last-child{border-bottom:none}
.alert .mark{width:8px;height:8px;border-radius:50%}
.alert .go{color:var(--muted);font-size:1.1rem}
.catbars{display:flex;flex-direction:column;gap:10px}
.catbar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:4px 10px;align-items:center;cursor:pointer;background:none;border:none;padding:0;text-align:left;border-radius:6px;width:100%;font-weight:400}
.catbar .track{height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden;position:relative}
.catbar .fill{display:block;height:100%;border-radius:5px}
.catbar .bud{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.catbar .name{display:flex;gap:7px;align-items:center;min-width:0}
.catbar .name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbar .bnote{grid-column:2 / 4;font-size:.76rem;color:var(--muted);margin-top:-2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--accent-soft);white-space:nowrap}
.chart-wrap{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.txlist{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.tx:last-child{border-bottom:none}
.tx .d{font-family:var(--f-num);font-size:.8rem;color:var(--muted);padding-top:2px}
.tx .n{font-weight:500;overflow-wrap:anywhere}
.tx .m{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tx .a{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx select{font-size:.82rem;padding:3px 8px;border-radius:999px}
.txmeta{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagchip{font:inherit;font-size:.76rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-weight:500;white-space:nowrap}
.tagchip.on{color:var(--ink);background:var(--accent-soft)}
.tagchip.add{border-style:dashed}
.tagchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.accname{font-size:.76rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters>*{flex:1 1 9em;min-width:0}
.filters input{flex:2 1 100%}
@media (min-width:700px){.filters input{flex:2 1 14em}}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .meta{font-size:.82rem;color:var(--muted)}
.rec .amt{text-align:right}
.ywrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.yt{border-collapse:separate;border-spacing:0;font-size:.84rem;width:100%}
.yt th,.yt td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.yt th:first-child,.yt td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-family:var(--f-body);min-width:9.5em;max-width:12em;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line)}
.yt thead th{font-family:var(--f-body);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.yt thead th.cur{color:var(--warn)}
.yt td.avg,.yt th.avg{border-right:1px solid var(--line);color:var(--muted)}
.yt th,.yt td{padding-inline:8px}
.yt tr.grp td{font-weight:600;background:var(--bg);color:var(--ink)}
.yt tr.grp td:first-child{background:var(--bg)}
.yt tr.crow td:first-child{padding-left:20px}
.yt tr.foot td{font-weight:600;border-bottom:none}
.yt tr.foot.first td{border-top:2px solid var(--line)}
.yt td.z{color:var(--line)}
.yt td[data-act],.yt td:first-child[data-act]{cursor:pointer}
.yt td[data-act]:hover{outline:2px solid var(--accent);outline-offset:-2px}
.yt .nm{display:flex;gap:7px;align-items:center;overflow:hidden}
.yt .nm span:last-child{overflow:hidden;text-overflow:ellipsis}
.wrap.locked header.top>.row,.wrap.locked nav.tabs,.wrap.locked #banner{display:none}
.lockbox{max-width:360px;margin:40px auto 0;text-align:center;align-items:stretch}
.lockbox .lockicon{color:var(--accent);margin:0 auto}
.lockbox details{text-align:left}
.todo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.todo .tt{line-height:1.45;min-width:0}
.todo .tb{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:560px){.todo{grid-template-columns:1fr}.todo .tb{justify-content:flex-start}}
.bon{display:flex;flex-direction:column}
.bonrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font:inherit;color:inherit;background:none;border-left:none;border-right:none;border-top:none;border-radius:0;width:100%;text-align:left}
.bonrow .num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.bonrow.tot{font-weight:600;font-size:1.05rem}
.bonrow.end{border-top:2px solid var(--ink);border-bottom:none;margin-top:2px}
.bongrp>summary{list-style:none;cursor:pointer}
.bongrp>summary::-webkit-details-marker{display:none}
.bongrp>summary:hover{background:var(--accent-soft)}
.bongrp .nm{display:flex;gap:8px;align-items:center;min-width:0;font-weight:500}
.bongrp .chev{color:var(--muted);transition:transform .15s}
.bongrp[open] .chev{transform:rotate(90deg)}
.bonbar{grid-column:1 / -1;height:6px;background:var(--accent-soft);border-radius:3px;overflow:hidden}
.bonbar span{display:block;height:100%;border-radius:3px}
.bonitems{padding:2px 0 6px 20px;background:var(--bg)}
.bonhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:16px 4px 4px;font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line)}
.bonhead .num{font-size:1rem;text-transform:none;letter-spacing:0;font-family:var(--f-num)}
.bonhint{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 6px}
.bonrow.sub{padding:7px 8px;font-size:.92rem;cursor:pointer}
.bonrow.sub:hover{background:var(--accent-soft)}
.wf{display:flex;flex-direction:column;gap:2px}
.wf .r{display:grid;grid-template-columns:minmax(0,10.5em) minmax(0,1fr) 6.2em;gap:10px;align-items:center;background:none;border:none;border-radius:6px;padding:5px 4px;text-align:left;font:inherit;color:inherit;width:100%}
.wf button.r{cursor:pointer}
.wf button.r:hover{background:var(--accent-soft)}
.wf .nm{display:flex;gap:7px;align-items:center;min-width:0}
.wf .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf .tr{position:relative;height:14px}
.wf .bar{position:absolute;top:0;bottom:0;border-radius:3px;min-width:2px}
.wf .amt{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.wf .r.tot{border-top:1px solid var(--line);border-radius:0;margin-top:4px;padding-top:9px;font-weight:600}
.wf .r.tot:first-child{border-top:none;margin-top:0;padding-top:5px}
@media (max-width:520px){.wf .r{grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 4.8em;gap:6px}}
.days{display:flex;gap:3px;align-items:stretch;height:130px}
.day{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px}
.day .col{flex:1;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.day .col span{display:block;width:100%;max-width:22px;margin:0 auto;background:var(--out);border-radius:3px 3px 0 0;min-height:0}
.day small{font-size:.68rem;color:var(--muted);text-align:center;font-family:var(--f-num)}
.big{font-family:var(--f-display);font-weight:700;font-size:2.4rem;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 12px;font-size:.88rem}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.payers .rec{cursor:pointer;background:none;border:none;border-bottom:1px solid var(--line);width:100%;text-align:left;font:inherit;color:inherit;border-radius:0}
.pill{font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.pill.rise{border-color:var(--out);color:var(--out)}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,12em);gap:10px 14px;align-items:center}
.form label{font-size:.92rem}
.form .hint{grid-column:1 / -1;font-size:.8rem;color:var(--muted);margin-top:-6px}
@media (max-width:520px){.form{grid-template-columns:1fr}.form .hint{margin-top:-4px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;border-radius:0;padding:7px 12px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--bg)}
.result{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.line{display:flex;justify-content:space-between;gap:10px}
.result .total{font-family:var(--f-display);font-size:1.3rem;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.note{font-size:.82rem;color:var(--muted)}
.progress{height:12px;border-radius:6px;background:var(--accent-soft);overflow:hidden}
.progress span{display:block;height:100%;border-radius:6px;background:var(--accent)}
.potbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.potbox{grid-template-columns:1fr 1fr}}
.list .item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:none}
.list .item .mt{overflow-wrap:anywhere}
.budgets .item{grid-template-columns:minmax(0,1fr) 8em}
.addrule{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px}
.addgoal{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px}
@media (max-width:620px){.addrule,.addgoal{grid-template-columns:1fr 1fr}}
.goal{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:none}
.goal input{width:8em}
.acc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:none}
.acc .iban{grid-column:1 / -1;font-family:var(--f-num);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.acc .acctags{grid-column:1 / -1}
.addacc{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
@media (max-width:620px){.addacc{grid-template-columns:1fr 1fr}}
.addacc>*,.addgoal>*,.addrule>*{min-width:0;width:100%;box-sizing:border-box}
input[type=date],input[type=month]{min-width:0;max-width:100%}
details.card summary{cursor:pointer;list-style-position:outside}
.codebox{font-family:var(--f-num);font-size:.8rem;background:var(--accent-soft);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere;user-select:all}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--in)} .status.err i{background:var(--out)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:10;font-size:.9rem}
.toast button{background:transparent;color:var(--bg);border-color:var(--bg);flex:none}
.empty{color:var(--muted);text-align:center;padding:20px 0}
ol.steps{margin:6px 0 0;padding-left:1.2em;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:no-preference){.catbar .fill,.progress span{transition:width .4s ease}}

body{font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;padding-inline:18px;padding-block:22px 96px}
.num,.stat .v,.tx .a,.wf .amt,.bonrow .num,.yt th,.yt td{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1}
h1{font-weight:700;font-size:1.75rem;letter-spacing:-.015em}
h2{font-weight:600;font-size:1.12rem;letter-spacing:-.005em}
h3{text-transform:none;letter-spacing:0;font-size:.86rem;font-weight:500;color:var(--muted)}
.yt thead th{text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:500}
.bonhead{text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:600;color:var(--ink);padding:18px 4px 6px}
.bonhead .note{font-weight:400}
.card{border:none;border-radius:var(--r);padding:20px;box-shadow:0 1px 0 var(--line)}
.stack{gap:16px}
.rec{padding:12px 0}
.note{font-size:.84rem;line-height:1.5}
.sub{font-size:.9rem}
.big{font-weight:700;letter-spacing:-.025em}
.btn-primary{color:var(--surface)}
.chips button[aria-pressed=true],.seg button[aria-pressed=true]{color:var(--surface)}
nav.tabs{margin:20px 0 18px;gap:4px;border-bottom:none;padding-bottom:2px}
nav.tabs button{padding:8px 14px;border-radius:999px;border:none;font-weight:500}
nav.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line);font-weight:600;border-bottom:none}
.bonbar{height:5px;background:var(--line)}
.bonitems{background:transparent;border-left:2px solid var(--line);margin-left:4px;padding-left:14px}
.bongrp>summary:hover,.bonrow.sub:hover{background:transparent;color:var(--accent)}
.bonrow.end{border-top:1.5px solid var(--ink)}
.potbox h3{margin-bottom:2px}
.potbox .num{font-size:1.15rem;font-weight:600}

details.why[open]>summary{margin-bottom:8px}
details.why .note{margin-top:6px}

details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"›";color:var(--muted);font-size:1.2rem;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(90deg)}
details.fold>summary .note{font-weight:400;margin-left:auto}
details.fold>.card{box-shadow:none;padding-top:0}
details.fold>.card>h2:first-child,details.fold>.card>.spread:first-child>h2,details.fold>.card>div:first-child>h2{display:none}

let saveChain=Promise.resolve();
function saveLocal(){
  if(LOCKED) return;
  if(!LK){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){} return;}

  saveChain=saveChain.then(async()=>{const iv=crypto.getRandomValues(new Uint8Array(12));

}

async function unlock(pw){

  S=cleanState(JSON.parse(td.decode(plain))); LK=key; LSALT=salt; SESSION_PW=pw; LOCKED=false; LOCKBLOB=null;
}

}

/* ---------- Periodes: waar begint "de maand" ---------- */
let PERIODS=[], PIDX={};
function addDays(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function addMonths(y,m,n){const t=y*12+(m-1)+n;return [Math.floor(t/12),t%12+1];}
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const ymd=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(Math.min(d,dim(y,m))).padStart(2,'0')}`;
const payerKey=t=>normName(t.name)||normName(t.desc);
function payerCandidates(){
  const g={};for(const t of S.tx){if(t.amount<=0)continue;const k=payerKey(t);if(!k)continue;(g[k]=g[k]||{key:k,name:t.name||t.desc,dates:[],amts:[]});g[k].dates.push(t.date);g[k].amts.push(t.amount);}
  return Object.values(g).filter(x=>x.dates.length>=2).map(x=>({...x,day:Math.round(median(x.dates.map(d=>+d.slice(8)))),amount:median(x.amts),total:x.amts.reduce((a,b)=>a+b,0)}))
    .sort((a,b)=>b.amount-a.amount).slice(0,8);
}
function salaryDates(){const P=S.period||{};if(P.mode!=='salary'||!P.payer)return [];return [...new Set(S.tx.filter(t=>t.amount>0&&payerKey(t)===P.payer).map(t=>t.date))].sort();}
function buildPeriods(){
  const P=S.period||{mode:'cal'}; const today=todayISO();
  const dates=S.tx.map(t=>t.date).sort();
  const minD=dates[0]||today, maxD=[dates[dates.length-1]||today,today].sort()[1];
  let nominal=1, real=[];
  if(P.mode==='day') nominal=Math.min(28,Math.max(1,+P.day||1));
  if(P.mode==='salary'){ real=salaryDates(); nominal=real.length?Math.round(median(real.map(d=>+d.slice(8)))):Math.min(28,Math.max(1,+P.day||1)); }
  // vaste grenzen rond de hele periode, plus de echte salarisdatums
  const b=new Set(); let [y,m]=addMonths(+minD.slice(0,4),+minD.slice(5,7),-1);
  const stop=addDays(maxD,62);
  while(ymd(y,m,1)<=stop){ const d=ymd(y,m,nominal);
    if(!real.length||d<addDays(real[0],-20)||d>addDays(real[real.length-1],20)) b.add(d);
    [y,m]=addMonths(y,m,1); }
  real.forEach(d=>b.add(d));
  const starts=[...b].sort();
  PERIODS=[];PIDX={};const used=new Set();
  starts.forEach((st,i)=>{
    const end=i<starts.length-1?addDays(starts[i+1],-1):addDays(ymd(...addMonths(+st.slice(0,4),+st.slice(5,7),1),+st.slice(8)),-1);
    // sleutel = de maand waarin de "bedoelde" startdag valt (vangt vervroegd salaris op)
    const sy=+st.slice(0,4),sm=+st.slice(5,7);
    let best=null;for(const k of [-1,0,1]){const [yy,mm]=addMonths(sy,sm,k);const c=ymd(yy,mm,nominal);const dd=Math.abs(daysBetween(c,st));if(!best||dd<best.dd)best={dd,key:c.slice(0,7)};}
    let key=best.key; while(used.has(key)){const [yy,mm]=addMonths(+key.slice(0,4),+key.slice(5,7),1);key=`${yy}-${String(mm).padStart(2,'0')}`;} used.add(key);
    const mid=addDays(st,Math.floor(daysBetween(st,end)/2));
    const per={key,start:st,end,mid,name:MONTHS[+mid.slice(5,7)-1]+' '+mid.slice(0,4),short:MSHORT[+mid.slice(5,7)-1],year:+mid.slice(0,4)};
    PERIODS.push(per);PIDX[key]=per;
  });
}
function periodOf(date){let lo=0,hi=PERIODS.length-1,r=PERIODS[0];while(lo<=hi){const md=(lo+hi)>>1;if(PERIODS[md].start<=date){r=PERIODS[md];lo=md+1;}else hi=md-1;}return r;}

/* ---------- CSV inlezen (ING) ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false;} else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f);rows.push(row);row=[];f=''; }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function parseAmount(s){
  s=String(s).trim().replace(/[€\s]/g,'');
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(',','.');
  return parseFloat(s);
}
function parseDate(s){
  s=String(s).trim(); let m;
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/)) return `${m[1]}-${m[2]}-${m[3]}`;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return `${m[1]}-${m[2]}-${m[3]}`;
  if(m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/)) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function ingRowsToTx(rows){
  const head=rows[0].map(h=>h.toLowerCase().trim());
  const col=(...names)=>head.findIndex(h=>names.some(n=>h===n||h.startsWith(n)));
  const iD=col('datum','date'),iN=col('naam','name'),iR=col('rekening','account'),iT=col('tegenrekening','counterparty'),
        iC=col('code'),iAB=col('af bij','debit/credit'),iB=col('bedrag','amount'),iM=col('mutatiesoort','transaction type'),
        iMed=col('mededelingen','notifications','omschrijving'),iS=col('saldo','resulting balance'),
        iDesc=col('omschrijving','description'),iAN=col('rekening naam','account name');
  if(iD<0||iB<0) throw new Error('Dit lijkt geen ING-export: ik vind geen kolommen "Datum" en "Bedrag".');
  const out=[];
  for(const r of rows.slice(1)){
    const date=parseDate(r[iD]); if(!date) continue;
    let amt=parseAmount(r[iB]); if(isNaN(amt)) continue;
    const ab=(iAB>=0?r[iAB]:'').trim().toLowerCase();
    if(ab==='af'||ab==='debit') amt=-Math.abs(amt); else if(ab==='bij'||ab==='credit') amt=Math.abs(amt);
    const t={date,name:(r[iN]||'').trim(),account:iR>=0?(r[iR]||'').trim():'',counter:iT>=0?(r[iT]||'').trim():'',code:iC>=0?r[iC]:'',
      amount:Math.round(amt*100)/100,type:iM>=0?(r[iM]||'').trim():'',desc:iMed>=0?(r[iMed]||'').trim():'',saldo:iS>=0?r[iS]:''};
    if(!t.name&&iDesc>=0) t.name=(r[iDesc]||'').trim();
    if(iAN>=0&&/spaar|saving|deposito/i.test(r[iAN]||'')) t.accType='spaar';
    t.id=hash([t.date,t.amount,t.name,t.desc,t.saldo,t.counter,t.account].join('|'));
    out.push(t);
  }
  return out;
}
function readFile(file,check=true){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const t=fr.result; if(check&&t.includes('\uFFFD')){const f2=new FileReader();f2.onload=()=>res(f2.result);f2.onerror=rej;f2.readAsText(file,'windows-1252');} else res(t);};
    fr.onerror=rej; fr.readAsText(file,'utf-8');
  });
}

function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}

const BILL_CATS=new Set(['Wonen','Energie & water','Internet & telefoon','Verzekeringen','Abonnementen','Belastingen','Kinderen','Gezondheid','Schrijfkosten']);
function recurring(){
  const groups={};
  for(const t of TX){ if(t.amount>=0||!inScope(t)||SAVING.has(t.cat)||IGNORE.has(t.cat)) continue;
    const k=isPP(t)?'paypal '+ppKey(t):(normName(t.name)||normName(t.desc)); if(!k) continue; (groups[k]=groups[k]||[]).push(t); }
  const res=[]; const lastData=TX.length?TX[0].date:todayISO();
  const FDAYS={maand:30.4,kwartaal:91,halfjaar:182,jaar:365};
  for(const [key,list] of Object.entries(groups)){
    const force=(S.recur||{})[key]; if(force==='no') continue;
    if(force&&FDAYS[force]){ const so=[...list].sort((a,b)=>a.date.localeCompare(b.date)); const last=so[so.length-1]; const am=so.slice(-3).map(t=>-t.amount);
      const amount=median(am); const nx=addDays(last.date,Math.round(FDAYS[force]));
      res.push({key,manual:true,variable:Math.max(...am)-Math.min(...am)>amount*.1,day:+last.date.slice(8),gap:FDAYS[force],account:normIban(last.account),name:last.name,cat:last.cat,freq:force,amount,
        monthly:amount*{maand:1,kwartaal:1/3,halfjaar:1/6,jaar:1/12}[force],last:last.date,next:nx,count:so.length,rise:null}); continue; }
    if(list.length<2) continue;
    const sorted=[...list].sort((a,b)=>a.date.localeCompare(b.date)).slice(-13); // recent patroon
    const gaps=[];for(let i=1;i<sorted.length;i++) gaps.push(daysBetween(sorted[i-1].date,sorted[i].date));
    const g=median(gaps); const amts=sorted.map(t=>-t.amount); const med=median(amts);
    const spread=Math.max(...amts.map(a=>Math.abs(a-med)))/med;
    let freq=null, variable=false;
    const regular=gaps.filter(x=>Math.abs(x-30.4)<=8).length>=gaps.length*.8;
    if(g>=25&&g<=36&&sorted.length>=3&&regular&&spread<=.2) freq='maand';
    else if(g>=25&&g<=36&&sorted.length>=4&&regular&&spread<=.8&&BILL_CATS.has(sorted[sorted.length-1].cat)&&sorted.filter(t=>/incasso|direct debit/i.test(t.type)).length>=sorted.length*.6){ freq='maand'; variable=true; } // wisselend bedrag, vast ritme (telefoon, energie)
    else if(g>=80&&g<=100&&spread<=.25) freq='kwartaal';
    else if(g>=170&&g<=195&&spread<=.25) freq='halfjaar';
    else if(g>=350&&g<=380&&spread<=.25) freq='jaar';
    if(!freq) continue;
    const last=sorted[sorted.length-1]; const lastAmt=-last.amount;
    if(daysBetween(last.date,lastData)>g*2+10) continue; // gestopt / opgezegd
    const prev=amts.slice(0,-1); const prevMed=median(prev);
    const rise=(!variable&&prev.length>=2&&lastAmt>prevMed*1.03&&lastAmt-prevMed>=0.5)?{from:prevMed,to:lastAmt}:null;
    const amount=variable?median(amts.slice(-3)):rise?lastAmt:med;
    const factor={maand:1,kwartaal:1/3,halfjaar:1/6,jaar:1/12}[freq];
    const next=new Date(last.date); next.setDate(next.getDate()+Math.round(g));
    res.push({key,variable,day:+last.date.slice(8),gap:g,account:normIban(last.account),name:isPP(last)?ppLabel(last):last.name,cat:last.cat,freq,amount,monthly:amount*factor,last:last.date,next:next.toISOString().slice(0,10),count:sorted.length,rise});
  }
  return res.sort((a,b)=>b.monthly-a.monthly);
}

function taxOn(x){let t=0,prev=0;for(const [lim,r] of TAX.brackets){if(x>prev){t+=(Math.min(x,lim)-prev)*r;}prev=lim;}return t;}
function taxCalc(year){
  const st=S.tax[year]||{};
  const auto=royaltiesFor(year).reduce((s,t)=>s+t.amount,0);
  const costTx=TX.filter(t=>t.cat==='Schrijfkosten'&&t.amount<0&&inScope(t,false)&&t.date.startsWith(String(year)));
  const autoCost=costTx.reduce((s,t)=>s-t.amount,0);
  const other=+st.other||0, extra=+st.extra||0, prepaid=+st.prepaid||0;
  const costs=st.costs===undefined||st.costs===''?autoCost:+st.costs;
  const mode=st.mode||'overig', za=st.za!==false;
  const gross=auto+extra; const profit=Math.max(0,gross-costs);
  let taxable=profit, zaUsed=0, mkbUsed=0;
  if(mode==='onderneming'){ zaUsed=za?Math.min(TAX.za,profit):0; const a=profit-zaUsed; mkbUsed=a*TAX.mkb; taxable=a-mkbUsed; }
  let ib=taxOn(other+taxable)-taxOn(other);

  ib+=topPart*(TAX.brackets[2][1]-TAX.deductCap);

  const reservedManual=+(S.taxReserved[year]||0);
  return {auto,autoCost,costTx,other,extra,costs,mode,za,gross,profit,taxable,zaUsed,mkbUsed,ib,zvw,total,rate,prepaid,due:total-prepaid,st,reservedTx,reservedManual,reserved:reservedTx+reservedManual+prepaid};
}

  const [y,m]=g.by.split('-').map(Number); const n=new Date(); const left=Math.max(1,(y-n.getFullYear())*12+(m-(n.getMonth()+1))+1);

/* ---------- Winkels: nette naam per bedrijf ---------- */
const CHAINS=['albert heijn','jumbo','lidl','aldi','plus','dirk','coop','hoogvliet','vomar','spar','ekoplaza','picnic','etos','kruidvat','hema','action','blokker','xenos','primark','zeeman','wibra','ikea','gamma','praxis','karwei','hornbach','intratuin','bol.com','coolblue','zalando','amazon','temu','wehkamp','mediamarkt','thuisbezorgd','uber eats','deliveroo','mcdonald','burger king','kfc','starbucks','domino','new york pizza','febo','la place','bagels & beans','ns','shell','esso','bp','tango','tinq','texaco','q-park','apotheek','pets place','welkoop','jumper','intertoys','bart smit','dille & kamille','tk maxx','h&m','c&a','decathlon','ici paris','douglas','rituals','netflix','spotify','vodafone','odido','kpn','ziggo','efteling','pathe','kinepolis'];
const PREFIX=/^(ccv|sumup|zettle|bck|sns|mollie|adyen|pay\.nl|stripe|worldline|ingenico|ccv\s*pay|myp|tikkie)\s*[*_]+\s*/i;
const MERCH=new Map();
function merchantName(t){
  const raw=(t.name||t.desc||'').trim(); if(MERCH.has(raw)) return MERCH.get(raw);
  let n=raw.replace(PREFIX,'').replace(/^paypal.*?\*\s*/i,'');
  const low=' '+n.toLowerCase().replace(/[^\p{L}\d&.' ]/gu,' ')+' ';
  let out=null;
  for(const c of CHAINS){ if(low.includes(' '+c+' ')||low.startsWith(' '+c)){ out=c; break; } }
  if(out) out=out.replace(/\b\p{L}/gu,ch=>ch.toUpperCase()).replace(/bol\.com/i,'bol.com').replace('Mcdonald',"McDonald's").replace('Ns','NS').replace('Hema','HEMA').replace('Ikea','IKEA').replace('Kpn','KPN').replace('Bp','BP').replace('H&m','H&M').replace('C&a','C&A');
  else { const w=n.replace(/\d+/g,' ').replace(/[*_#]/g,' ').replace(/\b(b\.?v\.?|n\.?v\.?|bv|nv|vof|holding|nederland|nl|filiaal|winkel|store)\b/gi,' ').replace(/\s+/g,' ').trim().split(' ');
    out=w.filter(x=>/[\p{L}\d]/u.test(x)).slice(0,3).join(' ')||raw; if(out===out.toUpperCase()&&out.length>3) out=out.toLowerCase().replace(/\b\p{L}/gu,ch=>ch.toUpperCase()); }
  MERCH.set(raw,out); return out;
}
function merchantList(txs){
  const g={};
  for(const t of txs){ if(IGNORE.has(t.cat)||SAVING.has(t.cat)||(t.amount>0&&INCOME.has(t.cat))) continue;
    const m=merchantName(t); const o=g[m]||(g[m]={name:m,sum:0,n:0,cats:{},last:t.date}); o.sum-=t.amount; if(t.amount<0)o.n++; o.cats[t.cat]=(o.cats[t.cat]||0)-t.amount; if(t.date>o.last)o.last=t.date; }
  return Object.values(g).filter(o=>o.sum>=0.5).sort((a,b)=>b.sum-a.sum).map(o=>({...o,cat:Object.entries(o.cats).sort((a,b)=>b[1]-a[1])[0][0]}));
}
function merchantCard(txsAll,title,sub,key){
  const fixed=new Set(recurring().map(r=>r.key)); const hideFixed=ui.merchFixed!==true;
  const txs=hideFixed?txsAll.filter(t=>!fixed.has(normName(t.name)||normName(t.desc))):txsAll;
  const L=merchantList(txs); if(!L.length&&!hideFixed) return '';
  const max=L[0].sum, tot=L.reduce((a,o)=>a+o.sum,0); const show=ui.merchAll===key?L:L.slice(0,12);
  return `<div class="card stack"><div class="spread"><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div><span class="num out">${eur0.format(tot)}</span></div>
    <div class="catbars">${show.map(o=>`<button class="catbar" data-act="merch" data-m="${esc(o.name)}" data-from="${txs.length?txs.reduce((a,t)=>t.date<a?t.date:a,'9999'):''}" data-to="${txs.length?txs.reduce((a,t)=>t.date>a?t.date:a,'0000'):''}">
      <span class="name"><span class="dot" style="background:${catColor(o.cat)}"></span><span>${esc(o.name)} <span class="note">${o.n}×</span></span></span>
      <span class="track"><span class="fill" style="width:${(o.sum/max*100).toFixed(1)}%;background:${catColor(o.cat)}"></span></span>
      <span class="num">${eur.format(o.sum)}</span></button>`).join('')}</div>
    <div class="row">${L.length>12?`<button class="btn-small" data-act="merchall" data-k="${key}">${ui.merchAll===key?'Minder tonen':`Alle ${L.length} tonen`}</button>`:''}
      <button class="btn-small" data-act="merchfixed">${hideFixed?'Vaste lasten ook tonen':'Vaste lasten verbergen'}</button></div>
    <p class="note">De kleur is de categorie. Tik op een winkel voor de losse betalingen.${hideFixed?' Vaste lasten zoals huur en verzekeringen staan er niet bij.':''}</p></div>`;
}

function savingsAdvice(){
  const last12=doneMonths().slice(-12); if(last12.length<3) return 0;
  const v=last12.map(monthSum).map(x=>(x.inc-x.oneoffIn)-(x.out-x.oneoff));
  return Math.max(0,Math.floor(pct(v,.25)/25)*25);
}
function todoList(ctx){
  const {lastData,lastSal,nextSal,accRows,free,daysLeft}=ctx; const items=[]; const today=todayISO();
  const add=(key,text,btn)=>{ if(!(S.dismissed||{})[key]) items.push({key,text,btn}); };
  if(daysBetween(lastData,today)>6) add('load:'+lastData,`Je laatste transactie is van <b>${fmtD(lastData)}</b>. Laad je nieuwste afschriften in, dan klopt alles hieronder weer.`,`<label class="btn btn-small btn-primary" for="file">Inladen</label>`);
  accRows.filter(r=>daysBetween(r.last,lastData)>3).forEach(r=>add('stale:'+r.i+r.last,`Het afschrift van <b>${esc(r.label)}</b> loopt maar tot ${fmtD(r.last)}. Download die rekening opnieuw.`,`<label class="btn btn-small" for="file">Inladen</label>`));
  const vl=accRows.find(r=>/vast/i.test(r.label)&&(S.accounts[r.i]||{}).spend!==false);
  if(vl&&accRows.length>1) add('spend:'+vl.i,`Het geld op <b>${esc(vl.label)}</b> is al bestemd voor de vaste lasten. Tel het niet mee bij "vrij te besteden"?`,`<button class="btn-small" data-act="spendtoggle" data-iban="${esc(vl.i)}">Niet meetellen</button>`);
  if(lastSal&&daysBetween(lastSal,lastData)<=10){ const adv=savingsAdvice();
    const saved=TX.filter(t=>t.date>=lastSal&&SAVING.has(t.cat)&&inScope(t)).reduce((a,t)=>a-t.amount,0);
    if(adv>0&&saved<adv-5) add('save:'+lastSal,`Je salaris is binnen. Zet <b class="num">${eur0.format(adv-saved)}</b> opzij${saved>0?` (je deed al ${eur0.format(saved)})`:''}. Dat lukte de afgelopen maanden meestal ook.`,`<button class="btn-small" data-act="tab" data-tab="inzicht">Waarom dit bedrag?</button>`); }
  plannedOpen().forEach(p=>{const d=daysBetween(today,p.date); if(d<0||d>90) return; const m=Math.max(1,Math.ceil(d/30.4));
    add('plan:'+p.id+':'+periodKey(today),`<b>${esc(p.name)}</b> (${eur0.format(+p.amount)}) staat gepland op ${fmtD(p.date)}. ${m>1?`Zet er deze maand <b class="num">${eur0.format((+p.amount)/m)}</b> voor opzij.`:'Zorg dat het bedrag klaarstaat.'}`,`<button class="btn-small" data-act="tab" data-tab="doelen">Bekijken</button>`);});
  if(nextSal&&daysLeft&&free/daysLeft<10) add('krap:'+lastSal,`Het is krap tot je salaris: <b class="num">${eur.format(Math.max(0,free)/daysLeft)}</b> per dag. Kijk hieronder wat er nog afgaat.`,'');
  const since=addDays(lastData,-60); const ov=TX.filter(t=>t.date>=since&&t.cat==='Overig'&&t.amount<0&&inScope(t)).length;
  if(ov>=3) add('overig:'+periodKey(today),`<b>${ov} uitgaven</b> van de afgelopen twee maanden staan nog in "Overig". Als je ze indeelt, worden de overzichten duidelijker.`,`<button class="btn-small" data-act="todo-overig">Indelen</button>`);
  recurring().filter(r=>r.rise&&daysBetween(r.last,lastData)<=45).forEach(r=>add('rise:'+r.name+r.last,`<b>${esc(r.name)}</b> is duurder geworden: ${eur.format(r.rise.from)} → ${eur.format(r.rise.to)}. Nog nodig, of opzeggen?`,`<button class="btn-small" data-act="tab" data-tab="vast">Vaste lasten</button>`));
  const y=+today.slice(0,4); const tc=taxCalc(y); const short=tc.total-tc.reserved;
  if(tc.gross>0&&short>25) add('tax:'+periodKey(today),`Voor de belasting over je royalty's moet nog <b class="num">${eur0.format(short)}</b> opzij.`,`<button class="btn-small" data-act="tab" data-tab="belasting">Bekijken</button>`);
  return items;
}

/* ---------- Nu: hoe sta je ervoor ---------- */
function viewNu(){
  if(!TX.length) return emptyView();
  const lastData=TX[0].date;
  const sd=salaryDays(); const lastSal=sd.filter(d=>d<=lastData).pop();
  const gaps=sd.slice(1).map((d,i)=>daysBetween(sd[i],d)).filter(g=>g>20&&g<40);
  const nextSal=lastSal?addDays(lastSal,Math.round(gaps.length?median(gaps):30)):null;
  if(ui.win==='sal'&&!lastSal) ui.win='14';
  const curP=periodOf(lastData);
  const from=ui.win==='sal'?lastSal:ui.win==='maand'?(curP?curP.start:lastData.slice(0,8)+'01'):addDays(lastData,-(+ui.win)+1);

/* ---------- Wat moet blijven staan tot het salaris ---------- */
const recKey=t=>isPP(t)?'paypal '+ppKey(t):(normName(t.name)||normName(t.desc));
const DAILY=()=>GROUPS[1][1];
function reserveData(lastData,lastSal,nextSal,accRows){
  const cur=periodOf(lastData);
  const ws=lastSal&&nextSal&&nextSal>lastData?lastSal:(cur?cur.start:lastData.slice(0,8)+'01');
  const we=lastSal&&nextSal&&nextSal>lastData?addDays(nextSal,-1):(cur?cur.end:lastData.slice(0,8)+'28');
  const daysTot=Math.max(1,daysBetween(ws,we)+1), daysGone=Math.min(daysTot,Math.max(0,daysBetween(ws,lastData)+1));
  // vaste lasten die nog moeten komen, per rekening
  const bills={};
  for(const r of recurring()){
    const paid=TX.some(t=>t.amount<0&&t.date>=ws&&t.date<=we&&recKey(t)===r.key);
    if(paid) continue;
    let due=null;
    if(r.freq==='maand'){ for(let d=addDays(lastData,1);d<=we&&!due;d=addDays(d,1)){ if(+d.slice(8)===Math.min(r.day,dim(+d.slice(0,4),+d.slice(5,7)))) due=d; } }
    else if(r.next>lastData&&r.next<=we) due=r.next;
    if(!due) continue;
    const a=r.account||'?'; (bills[a]=bills[a]||[]).push({name:r.name,amount:r.amount,due});
  }
  // dagelijkse uitgaven: wat er normaal per maand van deze rekening gaat, min wat er al uit is
  const full=months().filter(k=>PIDX[k]&&PIDX[k].end<ws).slice(-6);
  const rows=accRows.map(r=>{
    const typ={}, spent={};
    for(const c of DAILY()){
      const per=full.map(k=>-TX.filter(t=>t.mk===k&&t.cat===c&&normIban(t.account)===r.i).reduce((x,t)=>x+t.amount,0));
      typ[c]=per.length?Math.max(0,median(per)):0;
      spent[c]=Math.max(0,-TX.filter(t=>t.date>=ws&&t.date<=lastData&&t.cat===c&&normIban(t.account)===r.i).reduce((x,t)=>x+t.amount,0));
    }
    const daily=DAILY().map(c=>({c,typ:typ[c],spent:spent[c],need:Math.max(0,typ[c]-spent[c])})).filter(x=>x.need>=15);
    const bl=(bills[r.i]||[]).sort((a,b)=>a.due.localeCompare(b.due));
    const billTot=bl.reduce((x,b)=>x+b.amount,0), dailyTot=daily.reduce((x,d)=>x+d.need,0);
    const keep=billTot+dailyTot;
    return {...r,bills:bl,billTot,daily,dailyTot,keep,free:r.end-keep};
  });
  // welke rekeningen normaal worden aangevuld vanaf een andere eigen rekening
  const since=addDays(lastData,-183), feed={};
  for(const t of TX){ if(t.date<since||t.amount<=0||t.cat!=='Eigen rekening') continue; const fr=normIban(t.counter); if(!S.accounts[fr]||isSaveAcc(S.accounts[fr])) continue;
    const k=normIban(t.account); (feed[k]=feed[k]||{}); (feed[k][fr]=feed[k][fr]||new Set()).add(t.date.slice(0,7)); }
  rows.forEach(r=>{ r.feeds=Object.entries(feed[r.i]||{}).filter(([,m])=>m.size>=4).map(([fr])=>(S.accounts[fr]||{}).label||fr); });
  const planned=plannedOpen().filter(p=>p.date>lastData&&p.date<=we&&p.from!=='pot').map(p=>({name:p.name,amount:+p.amount,date:p.date}));
  return {ws,we,rows,planned,plannedTot:planned.reduce((x,p)=>x+p.amount,0),daysTot,daysGone};
}
function reserveCard(R,nextSal){
  if(!R.rows.length) return '';
  const till=nextSal?`tot je salaris op ${fmtD(addDays(R.we,1))}`:`tot ${fmtD(R.we)}`;

function billsCard(lastData,lastSal,nextSal,accRows,spendSet){
  const cur=periodOf(lastData);
  const ws=lastSal&&nextSal&&nextSal>lastData?lastSal:(cur?cur.start:lastData.slice(0,8)+'01');
  const we=lastSal&&nextSal&&nextSal>lastData?addDays(nextSal,-1):(cur?cur.end:lastData.slice(0,8)+'28');
  const multi=accRows.length>1;
  const items=[];
  for(const r of recurring()){
    const paid=TX.filter(t=>t.amount<0&&t.date>=ws&&t.date<=we&&recKey(t)===r.key);
    let due=null;
    if(r.freq==='maand'){ for(let d=ws;d<=we&&!due;d=addDays(d,1)){ if(+d.slice(8)===Math.min(r.day,dim(+d.slice(0,4),+d.slice(5,7)))) due=d; } }
    else if(r.next>=ws&&r.next<=we) due=r.next;
    if(!paid.length&&!due) continue;
    const counts=!r.account||!multi||spendSet.has(r.account);
    items.push({r,paid,due,counts,amt:paid.length?paid.reduce((a,t)=>a-t.amount,0):r.amount});
  }
  if(!items.length) return '';
  items.sort((a,b)=>(a.paid.length-b.paid.length)||((a.due||'').localeCompare(b.due||'')));
  const todo=items.filter(i=>!i.paid.length), done=items.filter(i=>i.paid.length);
  const todoTot=todo.reduce((a,i)=>a+i.amt,0), todoCount=todo.filter(i=>i.counts).reduce((a,i)=>a+i.amt,0), doneTot=done.reduce((a,i)=>a+i.amt,0);
  const accName=i=>multi&&i.r.account?esc((S.accounts[i.r.account]||{}).label||''):'';
  const row=(i)=>{const late=!i.paid.length&&i.due&&i.due<addDays(lastData,-3);
    return `<div class="rec" style="${i.paid.length?'opacity:.7':''}"><div style="min-width:0"><b>${i.paid.length?'<span class="in">✓</span> ':'<span style="color:var(--muted)">○</span> '}${esc(i.r.name)}</b>${i.r.freq!=='maand'?`<span class="pill">${i.r.freq}</span>`:''}${i.r.variable?'<span class="pill">wisselend</span>':''}
      <div class="meta">${i.paid.length?`afgeschreven ${fmtD(i.paid[0].date)}`:late?`<span class="warn">verwacht rond ${fmtD(i.due)}, nog niet gezien</span>`:`verwacht rond ${fmtD(i.due)}`}${accName(i)?' · '+accName(i):''}${!i.counts&&!i.paid.length?' · telt niet mee voor vrij te besteden':''}</div></div>
      <div class="amt"><div class="num ${i.paid.length?'':'out'}">${i.r.variable&&!i.paid.length?'± ':''}${eur.format(i.amt)}</div><button class="btn-link note" style="font-size:.75rem" data-act="recurno" data-key="${esc(i.r.key)}">geen vaste last</button></div></div>`;};
  return `<div class="card stack"><div class="spread"><h2>Vaste lasten deze maand</h2><span class="note">${fmtD(ws)} – ${fmtD(we)}</span></div>
    <div class="potbox"><div><h3>Nog te gaan</h3><div class="num out">${eur0.format(todoTot)}</div></div><div><h3>Al afgeschreven</h3><div class="num">${eur0.format(doneTot)}</div></div><div><h3>Totaal</h3><div class="num">${eur0.format(todoTot+doneTot)}</div></div></div>
    ${todo.length?`<div>${todo.map(row).join('')}</div>`:'<p class="in">Alle vaste lasten van deze maand zijn al afgeschreven.</p>'}
    ${done.length?`<details><summary class="note">Al afgeschreven (${done.length})</summary><div>${done.map(row).join('')}</div></details>`:''}
    <p class="note">Herkend uit je afschriften: betalingen die elke maand (of elk kwartaal of jaar) rond dezelfde dag terugkomen.${todoCount!==todoTot?` Van wat nog komt, gaat ${eur0.format(todoCount)} af van de rekeningen die meetellen voor "vrij te besteden".`:''} Mist er iets? Het moet minstens drie keer in je afschriften staan.</p>
  </div>`;
}

function groupOf(c){for(const [g,l] of GROUPS) if(l.includes(c)) return g; return 'Overig';}

const GCOL={'Vaste lasten':'#7C97D1','Dagelijks':'#C9A66B','Vrije uitgaven':'#C48AA3','Overig':'#8B929C','Buiten':'#9C8FBF'};

function accCoverage(){

function fullMonths(){
  if(!TX.length) return {ms:[],late:[]};
  const lastData=TX[0].date;
  const accs=accCoverage().filter(a=>a.n>=20);
  const full=from=>months().filter(k=>PIDX[k]&&PIDX[k].end<lastData&&PIDX[k].start>=addDays(from,-3));
  // liefst alleen maanden waarin alle rekeningen erin staan
  const latest=accs.length?accs.map(a=>a.min).sort().pop():TX[TX.length-1].date;
  let ms=full(latest), late=[];
  if(ms.length<3){ const earliest=accs.length?accs.map(a=>a.min).sort()[0]:TX[TX.length-1].date; ms=full(earliest); late=accs.filter(a=>daysBetween(earliest,a.min)>20); }
  return {ms,late};
}
function coverageCard(open){
  const rows=accCoverage(); if(!rows.length) return '';
  const sv=Object.entries(COV).filter(([i])=>isSaveAcc(S.accounts[i]));
  return `<details class="card stack" ${open?'open':''}><summary><b>Wat er is ingeladen</b> <span class="note">${rows.length} betaalrekening${rows.length>1?'en':''}${sv.length?`, ${sv.length} spaarrekening${sv.length>1?'en':''}`:''}</span></summary>

    <p class="note">Van wanneer tot wanneer er per rekening transacties in Kasboek staan. Dit is wat er nu op dit apparaat (en in Dropbox) staat. Ontbreekt er een periode, laad dan dat afschrift opnieuw in; dubbele transacties slaat Kasboek over.</p></details>`;
}
function gewoonData(){
  const fm=fullMonths(); const all=fm.ms; const N=Math.min(ui.gn||12,all.length); const sel=all.slice(-N); const set=new Set(sel);
  const inc={}, cat={}, perMonth={}; let saved=0, toSav=0, fromSav=0, nTo=0, nFrom=0;
  sel.forEach(k=>perMonth[k]={inc:0,out:0,cat:{}});
  for(const t of TX){ if(!set.has(t.mk)||!inScope(t)) continue; if(ui.gno&&S.oneoff[t.id]) continue;
    if(IGNORE.has(t.cat)) continue;
    if(SAVING.has(t.cat)){ saved+=-t.amount; if(t.amount<0){toSav-=t.amount;nTo++;} else {fromSav+=t.amount;nFrom++;} continue; }
    const pm=perMonth[t.mk];
    if(t.amount>0&&INCOME.has(t.cat)){ const k=t.cat==='Royalties'?"Royalty's":t.cat==='Overboeking eigen rekening'?'Van rekeningen buiten Kasboek':merchantName(t);
      inc[k]=(inc[k]||0)+t.amount; pm.inc+=t.amount; continue; }
    cat[t.cat]=(cat[t.cat]||0)-t.amount; pm.out+=-t.amount; pm.cat[t.cat]=(pm.cat[t.cat]||0)-t.amount; }
  const avg=v=>v/(N||1);
  const incL=Object.entries(inc).map(([k,v])=>({k,v:avg(v)})).sort((a,b)=>b.v-a.v);
  const top=incL.slice(0,5), rest=incL.slice(5).reduce((a,x)=>a+x.v,0); if(rest>=1) top.push({k:'Overig binnen',v:rest});
  const groups={};
  for(const [c,v] of Object.entries(cat)){ const g=c==='Overboeking eigen rekening'?'Buiten':groupOf(c);
    (groups[g]=groups[g]||{g,v:0,cats:[]}); groups[g].v+=avg(v); groups[g].cats.push({c,v:avg(v)}); }
  const order=['Vaste lasten','Dagelijks','Vrije uitgaven','Overig','Buiten'];
  const G=order.filter(g=>groups[g]&&Math.abs(groups[g].v)>=1).map(g=>{groups[g].cats.sort((a,b)=>b.v-a.v);return groups[g];});
  const incTot=incL.reduce((a,x)=>a+x.v,0), outTot=G.reduce((a,x)=>a+x.v,0);
  return {all,late:fm.late,sel,N,incL:top,incTot,G,outTot,over:incTot-outTot,saved:avg(saved),toSav:avg(toSav),fromSav:avg(fromSav),nTo,nFrom,perMonth,cat:Object.fromEntries(Object.entries(cat).map(([c,v])=>[c,avg(v)]))};
}

}

    <p class="note">${eur0.format(tot*12)} per jaar. Bij abonnementen helpt de vraag: heb ik dit de afgelopen maand gebruikt? Bij energie, internet en verzekeringen scheelt vergelijken en overstappen vaak het meest. Je zorgverzekering kun je elk jaar tot 31 december opzeggen.</p>

}

const pYear=k=>PIDX[k]?PIDX[k].year:+k.slice(0,4);
function yearCols(){

  if(!ui.yr||(ui.yr!=='12'&&!years.includes(+ui.yr))) ui.yr=years.includes(cy)?String(cy):'12';
  const cols=ui.yr==='12'?ks.slice(-12):ks.filter(k=>pYear(k)===+ui.yr);

}
function ytable(cols,rows,label){
  const today=todayISO(); const cur=k=>PIDX[k]&&PIDX[k].end>=today;
  const full=cols.filter(k=>!cur(k)).length||cols.length;
  const max=Math.max(1,...rows.filter(r=>r.type==='crow').flatMap(r=>r.vals));
  const cell=(v,r,k)=>{ if(!v) return `<td class="z">–</td>`;
    const heat=r.type==='crow'&&r.heat!==false?`background:color-mix(in srgb, ${r.color||'var(--out)'} ${Math.round(6+v/max*38)}%, transparent)`:'';
    return `<td style="${heat}" ${r.act&&k?`data-act="${r.act}" data-key="${esc(r.key)}" data-mk="${k}"`:''} title="${esc(r.label)}, ${mLabel(k)}: ${eur.format(v)}">${nf0.format(v)}</td>`; };
  return `<div class="ywrap"><table class="yt"><thead><tr><th>${label}</th><th>Totaal</th><th class="avg">Gem./mnd</th>${cols.map(k=>`<th class="${cur(k)?'cur':''}" title="${esc(mLabel(k))}${isCal()?'':' ('+pRange(k)+')'}">${mShort(k)}${cur(k)?'*':''}</th>`).join('')}</tr></thead><tbody>
   ${rows.map((r,i)=>{const tot=r.vals.reduce((a,b)=>a+b,0);const avg=r.vals.filter((v,j)=>!cur(cols[j])).reduce((a,b)=>a+b,0)/full;
     return `<tr class="${r.type}${r.type==='foot'&&(i===0||rows[i-1].type!=='foot')?' first':''}">
      <td ${r.act?`data-act="${r.act}" data-key="${esc(r.key)}" data-mk=""`:''}><span class="nm">${r.color?`<span class="dot" style="background:${r.color}"></span>`:''}<span>${esc(r.label)}</span></span></td>
      <td class="${r.cls||''}"><b>${nf0.format(tot)}</b></td><td class="avg ${r.cls||''}">${nf0.format(avg)}</td>
      ${r.vals.map((v,j)=>cell(v,r,cols[j])).join('')}</tr>`;}).join('')}
  </tbody></table></div>`;
}
function viewJaar(){
  const {years,cols}=yearCols(); if(!cols.length) return `<div class="card empty">Geen transacties in deze selectie.</div>`;

  const hasCur=cols.some(k=>PIDX[k]&&PIDX[k].end>=today);
  const full=cols.filter(k=>!(PIDX[k]&&PIDX[k].end>=today)).length||cols.length;
  const tIn=sums.reduce((a,x)=>a+x.inc,0), tOut=sums.reduce((a,x)=>a+x.out,0), tSav=sums.reduce((a,x)=>a+x.saved,0);
  const fullOut=sums.filter((x,j)=>!(PIDX[cols[j]]&&PIDX[cols[j]].end>=today)).reduce((a,x)=>a+x.out,0);
  // categorieën per groep
  const cats=[...new Set(sums.flatMap(x=>Object.keys(x.bycat)))];
  const grpNames=[...GROUPS.map(g=>g[0]),'Overig'];
  const rows=[]; const grpTot={};
  for(const g of grpNames){
    const cs=cats.filter(c=>groupOf(c)===g).map(c=>({c,vals:sums.map(x=>x.bycat[c]||0)})).map(o=>({...o,t:o.vals.reduce((a,b)=>a+b,0)})).sort((a,b)=>b.t-a.t);
    if(!cs.length) continue;
    const gv=cols.map((_,j)=>cs.reduce((a,o)=>a+o.vals[j],0)); grpTot[g]=gv.reduce((a,b)=>a+b,0);
    rows.push({type:'grp',label:g,vals:gv});

    const k=payerKey(t)||'?'; const o=pay[k]||(pay[k]={name:t.name||t.desc,n:0,sum:0,cat:t.cat}); o.n++; o.sum-=t.amount; }

  return `<div class="stack">
   <div class="spread"><select id="yr" aria-label="Periode">${years.slice().reverse().map(y=>`<option value="${y}" ${String(y)===ui.yr?'selected':''}>${y}</option>`).join('')}<option value="12" ${ui.yr==='12'?'selected':''}>Laatste 12 maanden</option></select>
     <div class="row">${scopeSelect()}</div></div>
   ${ui.acc||ui.tag?`<div class="row"><span class="chip">${ui.tag?`<span class="dot" style="background:${tagColor(ui.tag)}"></span>Alleen label ${esc(ui.tag)}`:`Alleen ${esc((S.accounts[ui.acc]||{}).label||'')}`}</span><button class="btn-small" data-act="scopeall">Alles tonen</button></div>`:''}
   <div class="stats">
     <div class="stat"><h3>Uitgegeven ${esc(String(title))}</h3><div class="v out">${eur0.format(tOut)}</div></div>
     <div class="stat"><h3>Gemiddeld per maand</h3><div class="v">${eur0.format(fullOut/full)}</div></div>
     <div class="stat"><h3>Binnen</h3><div class="v in">${eur0.format(tIn)}</div></div>
     <div class="stat"><h3>Over</h3><div class="v ${tIn-tOut-tSav<0?'out':''}">${eur0.format(tIn-tOut-tSav)}</div></div>
   </div>
   <p class="note">"Over" = binnen min uitgegeven min gespaard. Dat is hoeveel je saldo in deze periode steeg of daalde, geen geld dat nu klaarligt. Klopt het niet met je gevoel? Kijk bij Inzicht → <b>Klopt het?</b></p>
   ${gShare.length?`<div class="card stack"><h2>Waar het geld heen gaat</h2>

     <div class="legend">${gShare.map(([g,v])=>`<span><i style="background:${gCol[g]}"></i>${g} <b class="num">${Math.round(v/tOut*100)}%</b> · <span class="num">${eur0.format(v/full)}</span>/mnd</span>`).join('')}</div></div>`:''}
   <div class="card stack"><div class="spread"><h2>Uitgaven per categorie</h2><span class="note">Tik op een bedrag voor de transacties</span></div>

  </div>`;

function savingsSuggestions(){
  const g={};
  for(const t of S.tx){ const c=normIban(t.counter); if(!c||S.accounts[c]) continue;
    const h=(t.name+' '+t.desc+' '+t.type).toLowerCase(); if(!/spaar|savings|deposito/.test(h)) continue;
    const o=g[c]||(g[c]={iban:c,name:/oranje spaar/.test(h)?'Oranje Spaarrekening':(t.name||'Spaarrekening'),n:0}); o.n++; }
  return Object.values(g).sort((a,b)=>b.n-a.n).slice(0,6);
}
function pct(arr,q){const a=[...arr].sort((x,y)=>x-y);if(!a.length)return 0;const i=(a.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return a[lo]+(a[hi]-a[lo])*(i-lo);}
const doneMonths=()=>{const t=todayISO();return months().filter(k=>!(PIDX[k]&&PIDX[k].end>=t));};
const calM=k=>+k.slice(5,7);
function overChart(rows,advice){
  const W=Math.max(560,rows.length*40),H=180,top=22,bot=24; const vals=rows.map(r=>r.v);
  const mx=Math.max(1,...vals,advice), mn=Math.min(0,...vals); const sc=v=>top+(mx-v)/(mx-mn)*(H-top-bot);
  const step=W/rows.length,bw=Math.min(22,step*.62);
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,480)}px" role="img" aria-label="Wat er per maand overbleef">
    <line x1="0" x2="${W}" y1="${sc(0)}" y2="${sc(0)}" stroke="var(--line)"/>
    ${rows.map((r,i)=>{const x=i*step+(step-bw)/2,y=Math.min(sc(r.v),sc(0)),h=Math.max(1,Math.abs(sc(r.v)-sc(0)));
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${r.v<0?'var(--out)':r.v<advice?'var(--warn)':'var(--in)'}"><title>${mLabel(r.k)}: ${eur.format(r.v)}</title></rect>
      <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Figtree, system-ui, sans-serif">${mShort(r.k)}${calM(r.k)===1?" '"+r.k.slice(2,4):''}</text>`;}).join('')}
    ${advice>0?`<line x1="0" x2="${W}" y1="${sc(advice)}" y2="${sc(advice)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="2" y="12" font-size="11" fill="var(--accent)" font-family="Figtree, system-ui, sans-serif">- - - spaaradvies ${eur0.format(advice)}</text>`:''}
  </svg></div>`;
}
function viewInzicht(){
  const all=doneMonths(); const base=all.slice(-24); const last12=all.slice(-12);
  if(last12.length<3) return `<div class="stack">${scopeBar()}<div class="card empty">Voor inzicht zijn minstens drie afgesloten maanden nodig. Laad een langere periode in, bijvoorbeeld heel 2025.</div></div>`;
  const S12=last12.map(k=>({k,...monthSum(k)}));
  const normal=S12.map(x=>({k:x.k,v:(x.inc-x.oneoffIn)-(x.out-x.oneoff)}));
  const med=pct(normal.map(x=>x.v),.5), p25=pct(normal.map(x=>x.v),.25);
  const advice=Math.max(0,Math.floor(p25/25)*25);

/* Waarom zegt Kasboek dat er niets over is? Zoek de bekende oorzaken in de eigen gegevens. */
function saveDiag(S12,normal,p25,savedAvg){
  const salK=salaryKey(); const salName=(payerCandidates().find(x=>x.key===salK)||{}).name||'salaris';
  const salCount=k=>TX.filter(t=>t.mk===k&&t.amount>0&&payerKey(t)===salK&&inScope(t)).length;
  const rows=S12.map((x,i)=>({k:x.k,inc:x.inc-x.oneoffIn,out:x.out-x.oneoff,saved:x.saved,over:normal[i].v,sal:salK?salCount(x.k):1}));
  const odd=rows.filter(r=>r.sal!==1);
  const issues=[];
  if(salK&&isCal()&&odd.length>=2) issues.push(`<div class="todo"><div class="tt"><b>Je salaris valt rond de maandwisseling.</b> In ${odd.length} van de ${rows.length} maanden kwam ${esc(salName)} ${odd.some(r=>r.sal===0)?'niet':''}${odd.some(r=>r.sal===0)&&odd.some(r=>r.sal>1)?' of ':''}${odd.some(r=>r.sal>1)?'twee keer':''} binnen. Daardoor lijkt de ene maand rijk en de volgende een tekort. Laat de maand beginnen als je salaris binnenkomt.</div><div class="tb"><button class="btn-small btn-primary" data-act="fixperiod">Maand laten beginnen bij salaris</button></div></div>`);
  const sd=salaryDays(); const atm=TX.filter(t=>t.cat==='Contant opgenomen'&&inScope(t)&&afterSalary(t.date,sd)&&S12.some(x=>x.k===t.mk));
  const atmAvg=atm.reduce((a,t)=>a-t.amount,0)/S12.length;
  if(!S.cashAuto&&atmAvg>=40) issues.push(`<div class="todo"><div class="tt"><b>Je pint vlak na je salaris gemiddeld ${eur0.format(atmAvg)} per maand.</b> Is dat geld voor de spaarpot? Nu telt het als uitgave.</div><div class="tb"><button class="btn-small btn-primary" data-act="fixcash">Ja, telt als sparen</button></div></div>`);
  const cand={}; TX.filter(t=>t.amount<=-50&&inScope(t)&&S12.some(x=>x.k===t.mk)&&(t.cat==='Overig'||t.cat==='Overboeking eigen rekening'))
    .forEach(t=>{const k=payerKey(t)||normIban(t.counter);if(!k)return;const o=cand[k]||(cand[k]={key:k,name:t.name||t.desc||t.counter,sum:0,n:0,months:new Set(),iban:normIban(t.counter),spaar:/spaar|sparen|savings|buffer|reserve/i.test(t.name+' '+t.desc)});o.sum-=t.amount;o.n++;o.months.add(t.mk);});
  const sav=Object.values(cand).filter(o=>o.months.size>=3||o.spaar).sort((a,b)=>b.sum-a.sum).slice(0,4);
  if(sav.length) issues.push(`<div class="stack-s" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>Zijn dit overboekingen naar sparen?</b> Ze komen regelmatig terug en tellen nu als uitgave.</div>
    ${sav.map(o=>`<div class="todo" style="padding:6px 0;border:none"><div class="tt">${esc(o.name)} <span class="note">${o.n}× · gem. ${eur0.format(o.sum/S12.length)}/mnd</span></div><div class="tb"><button class="btn-small" data-act="fixsave" data-key="${esc(o.key)}" data-iban="${esc(o.iban)}" data-name="${esc(o.name)}">Is sparen</button></div></div>`).join('')}</div>`);
  const contradict=p25<=0||(savedAvg>100&&p25<savedAvg*.5);
  if(!contradict&&!issues.length) return `<details><summary class="note">Per maand bekijken</summary>${diagTable(rows)}</details>`;
  return `<div class="stack-s" style="border-top:1px solid var(--line);padding-top:10px">
    ${contradict?`<p><b>Klopt dit niet met wat je echt spaart?</b> ${issues.length?'Kasboek vond deze mogelijke oorzaken in je gegevens:':'Kijk per maand waar het tekort vandaan komt. Tik op een maand in Meer → Maand voor de details.'}</p>`:''}
    ${issues.join('')}
    <details ${contradict&&!issues.length?'open':''}><summary class="note">Per maand bekijken</summary>${diagTable(rows)}</details></div>`;
}

   ${rows.map(r=>`<tr class="crow"><td><span class="nm"><span>${esc(mLabel(r.k))}${r.sal===0?' <span class="warn">· geen salaris</span>':r.sal>1?' <span class="warn">· '+r.sal+'× salaris</span>':''}</span></span></td><td class="in">${nf0.format(r.inc)}</td><td>${nf0.format(r.out)}</td><td class="${r.over<0?'out':''}"><b>${nf0.format(r.over)}</b></td><td>${nf0.format(r.saved)}</td></tr>`).join('')}

function ppLabel(t){const i=(S.ppNames||{})[ppKey(t)];return i&&i.name?i.name+' (via PayPal)':'PayPal '+eur.format(Math.abs(t.amount));}
function ppSeries(){
  const lastData=TX.length?TX[0].date:todayISO(); const yr=addDays(lastData,-365);
  const g={}; TX.filter(t=>isPP(t)&&t.amount<0&&inScope(t)).forEach(t=>{const k=ppKey(t);(g[k]=g[k]||[]).push(t);});
  const out=[]; let looseYr=0, looseN=0;
  for(const [k,l] of Object.entries(g)){ const so=[...l].sort((a,b)=>a.date.localeCompare(b.date)); const amt=k/100;
    const gaps=so.slice(1).map((t,i)=>daysBetween(so[i].date,t.date)); const gm=gaps.length?median(gaps):null; const last=so[so.length-1].date;
    const inYr=so.filter(t=>t.date>=yr).length;
    let freq=null;
    if(so.length>=2&&gm>=330&&gm<=400) freq='jaar';
    else if(so.length>=3&&gm>=80&&gm<=100) freq='kwartaal';
    else if(so.length>=3&&gm>=25&&gm<=36) freq='maand';
    else if(so.length>=4&&gm<25) freq='vaker';
    else if(so.length>=3) freq='af en toe';
    if(!freq){ looseYr+=amt*inYr; looseN+=inYr; continue; }
    const stopped=freq!=='af en toe'&&gm&&daysBetween(last,lastData)>gm*2+10;
    const perMonth=freq==='jaar'?amt/12:freq==='kwartaal'?amt/3:freq==='maand'?amt:amt*inYr/12;
    out.push({k,amt,n:so.length,freq,last,stopped,perMonth,info:(S.ppNames||{})[k]||{},first:so[0].date});
  }
  const ord={maand:0,jaar:1,kwartaal:2,vaker:3,'af en toe':4};
  out.sort((a,b)=>(a.stopped-b.stopped)||(ord[a.freq]-ord[b.freq])||b.perMonth-a.perMonth);
  return {series:out,looseYr,looseN};
}
function ppCard(){

      <div class="amt num">${s.perMonth<10?eur.format(s.perMonth):eur0.format(s.perMonth)} <span class="note">/mnd</span></div></div>`).join('')}</div>

  </details>`;

function platChart(y,roy,names,pcol){
  const mk=Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,'0')}`);
  const data=mk.map(m=>{const o={};roy.filter(t=>t.date.slice(0,7)===m).forEach(t=>{const p=platformOf(t);o[p]=(o[p]||0)+t.amount;});return o;});
  const tot=data.map(o=>Object.values(o).reduce((a,b)=>a+b,0)); const max=Math.max(1,...tot);
  const W=560,H=150,pad=6,step=(W-pad*2)/12,bw=step*.6; const sc=v=>v/max*(H-30);
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:360px" role="img" aria-label="Royalty's per maand, per platform">
    <line x1="0" x2="${W}" y1="${H-20}" y2="${H-20}" stroke="var(--line)"/>
    ${data.map((o,i)=>{let yy=H-20;const x=pad+i*step+(step-bw)/2;return names.filter(n=>o[n]).map(n=>{const h=sc(o[n]);yy-=h;return `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(0,h-1)}" rx="2" fill="${pcol(n)}"><title>${esc(n)}, ${MONTHS[i]}: ${eur.format(o[n])}</title></rect>`;}).join('')+
      `<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Figtree, system-ui, sans-serif">${MSHORT[i]}</text>`;}).join('')}
  </svg></div><p class="note">Hoogste maand: ${eur.format(max)}.</p>`;
}
function yearText(y,c,plats){
  const L=[];const p=(a,b)=>L.push(a.padEnd(34,' ')+b);
  L.push(`Kasboek — schrijfinkomsten ${y}`,'');
  L.push('Royalty\'s per platform');
  plats.forEach(([n,a])=>p('  '+n,eur.format(a)));
  if(c.extra) p('  Overig (niet via ING)',eur.format(c.extra));
  p('  Totaal',eur.format(c.gross)); L.push('');
  L.push('Kosten');
  if(c.st.costs!==undefined&&c.st.costs!=='') p('  Zelf ingevuld',eur.format(c.costs));
  else c.costTx.forEach(t=>p(`  ${t.date} ${t.name}`.slice(0,33),eur.format(-t.amount)));
  p('  Totaal',eur.format(c.costs)); L.push('');
  p('Resultaat',eur.format(c.profit));
  p('Soort',c.mode==='onderneming'?'winst uit onderneming':'resultaat overige werkzaamheden');
  p('Geschatte IB + Zvw',eur.format(c.total));
  if(c.prepaid) p('Voorlopige aanslag betaald',eur.format(c.prepaid));
  L.push('','Schatting met tarieven '+TAX.year+'; geen belastingadvies.');
  return L.join('\n');
}

/* ---------- Versleuteling & back-up ---------- */
const te=new TextEncoder(), td=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function pack(obj){
  if(!getPw()) return JSON.stringify({kasboek:2,data:obj});
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(getPw(),salt); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))));
  return JSON.stringify({kasboek:2,enc:{s:b64(salt),i:b64(iv),d:b64(ct)}});
}
async function unpack(text){
  const p=JSON.parse(text);
  if(p.enc){ if(!getPw()) throw new Error('Dit bestand is versleuteld. Zet eerst de vergrendeling aan met hetzelfde wachtwoord (Instellingen).');
    try{const key=await deriveKey(getPw(),unb64(p.enc.s));return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.enc.i)},key,unb64(p.enc.d))));}
    catch(e){throw new Error('Het wachtwoord klopt niet bij dit bestand.');} }
  if(p.data) return p.data;
  if(p.tx) return p;
  throw new Error('Dit is geen Kasboek-back-up.');
}
function cleanState(o){const s={...clone(DEFAULT_STATE),...o};s.period={...DEFAULT_STATE.period,...(o.period||{})};return s;}

/* ---------- Dropbox ---------- */
const dbxConnected=()=>!!(D.dbxKey&&D.dbxRefresh);
function b64url(u8){return b64(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function dbxConnect(){
  const key=($('#dbxkey')?.value||'').trim()||DBX_APP_KEY;
  D.dbxKey=key; saveDevice();
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(verifier))));
  const state=b64url(crypto.getRandomValues(new Uint8Array(12)));
  try{sessionStorage.setItem('kasboek.pkce',JSON.stringify({verifier,state}));}catch(e){}
  try{localStorage.setItem('kasboek.pkce',JSON.stringify({verifier,state}));}catch(e){}
  const u=new URL('https://www.dropbox.com/oauth2/authorize');
  Object.entries({client_id:key,response_type:'code',code_challenge:challenge,code_challenge_method:'S256',redirect_uri:location.origin+location.pathname,token_access_type:'offline',state}).forEach(([k,v])=>u.searchParams.set(k,v));
  location.href=u.toString();
}
async function dbxHandleRedirect(){
  const p=new URLSearchParams(location.search); if(!p.has('code')&&!p.has('error')) return false;
  history.replaceState(null,'',location.pathname);
  if(p.has('error')){toast('Dropbox gaf geen toestemming.');return false;}
  let pk=null; try{pk=JSON.parse(sessionStorage.getItem('kasboek.pkce')||localStorage.getItem('kasboek.pkce'));}catch(e){}
  try{localStorage.removeItem('kasboek.pkce');}catch(e){}
  if(!pk||pk.state!==p.get('state')){toast('Koppelen mislukt. Probeer het nog eens.');return false;}
  try{
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'authorization_code',code:p.get('code'),client_id:D.dbxKey,code_verifier:pk.verifier,redirect_uri:location.origin+location.pathname})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error_description||'token');
    D.dbxAccess=j.access_token; D.dbxRefresh=j.refresh_token; D.dbxExp=Date.now()+(j.expires_in-60)*1000; D.syncErr=''; saveDevice();
    toast('Dropbox gekoppeld.'); return true;
  }catch(e){toast('Koppelen mislukt. Klopt de Redirect URI in je Dropbox-app?');return false;}
}
async function dbxToken(){
  if(D.dbxAccess&&Date.now()<D.dbxExp) return D.dbxAccess;
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token',refresh_token:D.dbxRefresh,client_id:D.dbxKey})});
  const j=await r.json(); if(!r.ok){ if(j.error==='invalid_grant'){D.dbxRefresh='';saveDevice();} throw new Error('Dropbox-toegang verlopen, koppel opnieuw.'); }
  D.dbxAccess=j.access_token; D.dbxExp=Date.now()+(j.expires_in-60)*1000; saveDevice(); return D.dbxAccess;
}
async function dbxDownload(){
  const tok=await dbxToken();
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+tok,'Dropbox-API-Arg':JSON.stringify({path:'/kasboek.json'})}});

async function dbxUpload(text){

function mergeById(a,b){const m=new Map();(a||[]).forEach(x=>m.set(x.id,x));(b||[]).forEach(x=>m.set(x.id,x));return [...m.values()];}
function mergeStates(a,b){
  const [newer,older]=(a.savedAt||0)>=(b.savedAt||0)?[a,b]:[b,a];
  const out=cleanState(clone(newer));
  const ids=new Set(out.tx.map(t=>t.id));
  if((older.savedAt||0)>(newer.wipedAt||0)) for(const t of older.tx||[]) if(!ids.has(t.id)){out.tx.push(t);ids.add(t.id);}
  out.overrides={...(older.overrides||{}),...(newer.overrides||{})};
  out.cash=mergeById(older.cash,newer.cash);out.planned=mergeById(older.planned,newer.planned);
  out.recur={...(older.recur||{}),...(newer.recur||{})};
  out.dismissed={...(older.dismissed||{}),...(newer.dismissed||{})};
  out.oneoff={...(older.oneoff||{}),...(newer.oneoff||{})};
  out.txTags={...(older.txTags||{}),...(newer.txTags||{})};
  out.accounts={...(older.accounts||{}),...(newer.accounts||{})};
  if(!a.sample||!b.sample){ out.sample=false; out.tx=out.tx.filter(t=>!t.sample); }
  out.savedAt=Math.max(a.savedAt||0,b.savedAt||0);
  return out;
}
let syncing=false, upTimer=null;
async function dbxSync(quiet){
  if(!dbxConnected()||syncing||IN_FRAME||LOCKED) return; syncing=true;
  try{
    const remoteText=await dbxDownload();
    if(remoteText){ const remote=cleanState(await unpack(remoteText)); S=mergeStates(S,remote); saveLocal(); }
    await dbxUpload(await pack(S));
    D.lastSync=Date.now(); D.syncErr=''; saveDevice();
    if(!quiet) toast('Gesynchroniseerd met Dropbox.');
  }catch(e){ D.syncErr=e.message; saveDevice(); if(!quiet) toast(e.message); }
  finally{ syncing=false; render(); }
}
function scheduleUpload(){
  if(!dbxConnected()||IN_FRAME||LOCKED) return; clearTimeout(upTimer);
  upTimer=setTimeout(async()=>{ if(LOCKED) return; if(syncing) return scheduleUpload(); try{await dbxUpload(await pack(S));D.lastSync=Date.now();D.syncErr='';}catch(e){D.syncErr=e.message;} saveDevice(); renderSync(); },3000);
}

  if(t.id==='facc'){ui.facc=t.value;ui.limit=150;render();}
  if(t.id==='fmonth'){ui.fmonth=t.value;ui.limit=150;render();}
  if(t.id==='fcat'){ui.fcat=t.value;ui.limit=150;render();}
  if(t.id==='taxYear'){ui.taxYear=+t.value;render();}
  if(t.matches('input[data-builtin]')){const k=t.dataset.builtin;S.disabledBuiltins=t.checked?S.disabledBuiltins.filter(x=>x!==k):[...S.disabledBuiltins,k];save();rebuild();}
  if(t.id==='t-za'){const y=ui.taxYear;S.tax[y]={...(S.tax[y]||{}),za:t.checked};save();render();}
  if(t.matches('input[data-ppname]')){S.ppNames=S.ppNames||{};const k=t.dataset.ppname;S.ppNames[k]={...(S.ppNames[k]||{}),name:t.value.trim()};save();render();}
  if(t.matches('select[data-ppcat]')){S.ppNames=S.ppNames||{};const k=t.dataset.ppcat;S.ppNames[k]={...(S.ppNames[k]||{}),cat:t.value};save();render();}
  if(t.matches('select[data-act-pot]')){for(const [i,x] of Object.entries(S.accounts)){if(x.type==='pot')x.type='spaar';} if(t.value&&S.accounts[t.value])S.accounts[t.value].type='pot';save();render();}
  if(t.matches('select[data-acctype]')){S.accounts[t.dataset.acctype].type=t.value;save();render();}
  if(t.matches('input[data-acclabel]')){S.accounts[t.dataset.acclabel].label=t.value.trim()||S.accounts[t.dataset.acclabel].label;save();}
  if(t.matches('input[data-budget]')){const v=+t.value;if(v>0)S.budgets[t.dataset.budget]=v;else delete S.budgets[t.dataset.budget];save();}
  if(t.matches('input[data-goal]')){const g=S.goals.find(x=>x.id===t.dataset.goal);if(g){g.saved=+t.value||0;save();render();}}
});
const taxFields={'t-extra':'extra','t-costs':'costs','t-other':'other','t-pre':'prepaid'};
let qTimer;
function rerenderKeep(id){render();const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='recq'){clearTimeout(qTimer);qTimer=setTimeout(()=>{ui.recq=t.value;rerenderKeep('recq');},250);}
  if(t.id==='q'){clearTimeout(qTimer);qTimer=setTimeout(()=>{ui.q=t.value;ui.limit=150;rerenderKeep('q');},250);}
  if(taxFields[t.id]){const y=ui.taxYear;S.tax[y]={...(S.tax[y]||{}),[taxFields[t.id]]:t.value};save();clearTimeout(qTimer);qTimer=setTimeout(()=>rerenderKeep(t.id),600);}
  if(t.id==='t-resman'){S.taxReserved[ui.taxYear]=t.value;save();clearTimeout(qTimer);qTimer=setTimeout(()=>rerenderKeep('t-resman'),600);}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') hiddenAt=Date.now();
  else if(LK&&hiddenAt&&Date.now()-hiddenAt>AUTOLOCK_MIN*60000){ lockNow(); return; }
  if(LOCKED) return;if(document.visibilityState==='visible'&&dbxConnected()&&Date.now()-D.lastSync>60000) dbxSync(true);});

/* ---------- Start ---------- */
let idleT; const resetIdle=()=>{clearTimeout(idleT); if(LK) idleT=setTimeout(lockNow,AUTOLOCK_MIN*60000);};
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
function afterOpen(){
  if(S.sample&&!S.tx.length) S=sampleState();
  render(); resetIdle();
  (async()=>{ if(IN_FRAME) return; const fresh=await dbxHandleRedirect(); if(dbxConnected()) dbxSync(!fresh); })();
}
load();
if(!D.seenNu){D.seenNu=true;D.tab='nu';saveDevice();}
if(D.tab&&['meer','nu','overzicht','jaar','inzicht','transacties','vast','doelen','belasting','instellingen'].includes(D.tab)) ui.tab=D.tab;
if(LOCKED) renderLock(); else afterOpen();
</script>
