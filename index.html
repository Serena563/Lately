<!DOCTYPE html>
<html lang="nl" data-theme="dag">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lately">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Caveat:wght@500&family=Nunito+Sans:wght@400;600;700&display=swap">
<title>Lately</title>
<style>
:root{--serif:'Lora',Georgia,serif;--sans:'Nunito Sans',-apple-system,BlinkMacSystemFont,sans-serif;--hand:'Caveat','Bradley Hand',cursive;--r:18px}
html[data-theme=dag]{--bg:#F5EFE3;--ink:#3A342C;--muted:#5A5247;--card:#FBF7EE;--line:#E3D8C3;--accent:#5E7F69;--accentInk:#FFFFFF;--fbg:#FBF7EE;--fink:#3A342C;--flabel:#5E7F69;--chip:#EFE7D8;--soft:#E3EEE5;
  --bar:linear-gradient(90deg,#C27461 0%,#D9A24E 24%,#86A992 42%,#86A992 58%,#D9A24E 76%,#C27461 100%);--zr:#C27461;--zo:#D9A24E;--zg:#86A992;--zgr:#86A992}
html[data-theme=nacht]{--bg:#262A3D;--ink:#F0ECF8;--muted:#C8C4DA;--card:#30354B;--line:#41475F;--accent:#C4B3F5;--accentInk:#1E2230;--fbg:#3B3358;--fink:#F6F2FF;--flabel:#D6CAFB;--chip:#3A4058;--soft:#463d68;
  --bar:linear-gradient(90deg,#D98B78 0%,#E8B26A 24%,#C4B3F5 42%,#C4B3F5 58%,#E8B26A 76%,#D98B78 100%);--zr:#D98B78;--zo:#E8B26A;--zg:#C4B3F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:22px 16px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.friend{background:var(--fbg);color:var(--fink);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.friend .lab{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--flabel)}
.friend .txt{font-family:var(--hand);font-size:25px;line-height:1.22}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--accent);color:var(--accentInk);border-radius:var(--r);padding:15px 18px;font-weight:700;width:100%;font-size:17px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:16px}
.btn.small{width:auto;padding:9px 14px;font-size:15px}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.q{display:flex;flex-direction:column;gap:6px}
.q .l{font-size:15px;font-weight:600}
.opts{display:flex;gap:6px}
.opt{flex:1;background:var(--chip);border-radius:12px;padding:10px 2px;font-size:14px;min-height:44px}
.opt.on{background:var(--accent);color:var(--accentInk);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:10px 14px;font-size:15px;min-height:44px}
.chip.on{background:var(--accent);color:var(--accentInk);font-weight:700}
.chip.love{background:var(--accent);color:var(--accentInk);font-weight:700}
.chip.dim{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.chip.pend{border:1.5px dashed currentColor;opacity:.85}
.dblk{margin-top:10px}.dblk .sub{margin:6px 0 0 10px;padding-left:10px;border-left:2px solid var(--line)}.dblk .sub .st{font-size:13px;color:var(--muted)}.dblk .sub .chips{margin-top:4px}.dblk:first-of-type{margin-top:4px}.dblk .dl{font-weight:700}.dblk .chips{margin-top:6px}
.wd{display:flex;flex-direction:column;gap:6px;margin-top:6px}.wdr{display:grid;grid-template-columns:28px 1fr 40px;align-items:center;gap:8px}.wdb{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}.wdb i{display:block;height:100%;background:var(--accent);border-radius:5px}
.grp{margin-top:12px}.grp .gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.grp .gh b{font-size:15px}.leaf{font-size:.8em}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.balk{position:relative;height:14px;border-radius:999px;background:var(--bar);margin:8px 0 2px}
.balk .dot{position:absolute;top:-7px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--bg);border:4px solid var(--ink);box-sizing:border-box}
.balk .mid{position:absolute;left:50%;top:-4px;width:2px;height:22px;background:var(--ink);opacity:.18}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px}
.mt{height:8px;border-radius:999px;background:var(--line);position:relative}
.mt i{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%}
.zr,.week i.zr{background:var(--zr)}.zo,.week i.zo{background:var(--zo)}.zg,.week i.zg{background:var(--zg)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);padding:4px 12px;min-height:44px;justify-content:center}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs .center{background:var(--accent);color:var(--accentInk);border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;margin-top:-26px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:64px}
.quick b{display:block;font-size:16px}
input[type=text],input[type=time],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
textarea{min-height:64px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,18,14,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.handle{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.breath{width:170px;height:170px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,var(--soft),var(--accent));animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;font-size:15px;max-width:90%}
details>summary{cursor:pointer;color:var(--accent);font-weight:700;list-style:none;min-height:32px}
details>summary::-webkit-details-marker{display:none}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.list li:last-child{border-bottom:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:13px}
.week div{display:flex;flex-direction:column;gap:4px;align-items:center}
.week i{display:block;width:100%;height:44px;border-radius:10px;background:var(--line)}
.tag{font-size:12px;color:var(--muted)}
.x{background:var(--chip);border-radius:10px;min-width:40px;min-height:40px}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-tab="vandaag">Vandaag</button>
  <button data-tab="inzichten">Inzichten</button>
  <button class="center" data-tab="checkin">Inchecken</button>
  <button data-tab="gedaan">Gedaan</button>
  <button data-tab="instellingen">Instellingen</button>
</nav>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<script>
"use strict";
const VERSION='2026-11-10c';
/* ================= Opslag ================= */
const KEY='lately-v3';
const DEF={
  blocks:[{id:'b1',label:'Nacht',time:'07:30',q:'Goedemorgen. Hoe was je nacht?'},{id:'b2',label:'Ochtend',time:'10:45',q:'Hoe is het nu? Even inchecken.'},
    {id:'b3',label:'Middag',time:'14:30',q:'Hoe is het nu? Even inchecken.'},{id:'b4',label:'Namiddag',time:'18:15',q:'Hoe is het nu? Even inchecken.'},{id:'b5',label:'Avond',time:'22:00',q:'Even terugkijken op je dag, en dan slapen.'}],
  questions:[
    {id:'energie',label:'Energie',opts:['laag','oké','veel'],type:'kost',when:'altijd',on:true},
    {id:'geluid',label:'Geluid komt binnen',opts:['hard','normaal','zacht'],type:'kost',when:'dag',on:true},
    {id:'thee',label:'Zou je nu thee voor jezelf zetten?',opts:['nee','met moeite','ja'],type:'kost',when:'dag',on:true},
    {id:'stemming',label:'Stemming',opts:['zwaar','meh','oké','fijn'],type:'gevoel',when:'altijd',on:true},
    {id:'somber',label:'Somberheid',opts:['veel','gewoon','weinig'],type:'gevoel',when:'avond',on:true,optional:true},
    {id:'prikkels',label:'Prikkels',opts:['veel','gewoon','weinig'],type:'kost',when:'dag',on:false},
    {id:'lontje',label:'Lontje',opts:['kort','gewoon','lang'],type:'kost',when:'dag',on:false},
    {id:'deken',label:'Trekt de deken?',opts:['ja','een beetje','nee'],type:'kost',when:'dag',on:false}],
  rest:[{n:'thee',kid:true},{n:'een uurtje lezen',kid:false},{n:'was opvouwen',kid:true},{n:'tv kijken',kid:true},{n:'gamen',kid:false}],
  week:{wake:'07:00',bed:'22:30',school:{1:{from:'08:30',to:'14:00'},2:{from:'08:30',to:'14:00'},3:{from:'08:30',to:'12:15'},4:{from:'08:30',to:'14:00'},5:{from:'08:30',to:'14:00'}},hobbies:[]},
};
let S=load(); fill();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.blocks) return s;}catch(e){}
  const d=JSON.parse(JSON.stringify(DEF));
  return {v:3,...d,noSchool:{},entries:[],events:[],acts:{},settings:{theme:'auto'},asked:{},link:{url:'',key:''},cal:{events:[],at:0},ratings:{},sleep:{},sigSince:0,hrSeen:{},places:[]};
}
function fill(){if(S.settings.hobbyWith==null) S.settings.hobbyWith=true; const OLD={b1:['Ochtendstart','Nacht','Hoe was je nacht?'],b2:['Middagstart','Ochtend','Hoe was je ochtend?'],b3:['Middag','Middag','Hoe was je middag?'],b4:['Avond','Namiddag','Hoe was je namiddag?'],b5:['Einde van de dag','Avond','Hoe was je avond, en hoe is het nu je gaat slapen?']};
  if(!S.labelsV2){ S.blocks.forEach(b=>{const o=OLD[b.id]; if(o&&b.label===o[0]){b.label=o[1]; b.q=o[2];}}); S.labelsV2=true; }
  if(!S.remindV3){ const nq={b1:'Goedemorgen. Hoe was je nacht?',b5:'Even terugkijken op je dag, en dan slapen.'}; S.blocks.forEach(b=>{ if(/^Hoe was je /.test(b.q||'')) b.q=nq[b.id]||'Hoe is het nu? Even inchecken.'; }); S.remindV3=true; }if(!S.settings.nudge) S.settings.nudge={on:true,time:'19:45'}; if(!S.settings.week) S.settings.week={on:true,time:'19:30'}; if(!S.settings.second) S.settings.second={on:true,after:45};if(!S.calIgnore) S.calIgnore=['picnic','recept'];for(const k of ['link','cal','ratings','sleep','hrSeen','places']) if(!S[k]) S[k]={link:{url:'',key:''},cal:{events:[],at:0},places:[]}[k]||{}; if(S.sigSince==null) S.sigSince=0; if(!Array.isArray(S.outs)) S.outs=[]; if(!S.alias) S.alias={}; if(!Array.isArray(S.outWhere)) S.outWhere=[];}
function save(quiet){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Opslaan lukte niet');} C=null; if(!quiet) dbxSoon();}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

/* ================= Hulpjes ================= */
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tstr=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const today=()=>dstr(new Date()); const nowT=()=>tstr(new Date());
const mins=t=>{const [h,m]=(t||'0:0').split(':').map(Number);return h*60+m;};
const mt=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAG=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAAND=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const fmtDate=ds=>{const d=new Date(ds+'T12:00');return DAG[d.getDay()]+' '+d.getDate()+' '+MAAND[d.getMonth()];};
const addDays=(ds,n)=>{const d=new Date(ds+'T12:00');d.setDate(d.getDate()+n);return dstr(d);};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
const blocksSorted=()=>[...S.blocks].sort((a,b)=>mins(a.time)-mins(b.time));
const lastBlock=()=>blocksSorted().slice(-1)[0];
function blockFor(time){let best=null,bd=1e9;for(const b of S.blocks){const d=Math.abs(mins(b.time)-mins(time));if(d<bd){bd=d;best=b;}}return best;}
function dueBlockRaw(){const n=mins(nowT());let cur=null;for(const b of blocksSorted()) if(mins(b.time)-30<=n) cur=b;return cur||blocksSorted()[0];}
// Het blok om nu in te vullen: het laatst verstreken blok, tenzij dat al is ingevuld; dan het blok waar je nu in zit.
function dueBlock(){ const d=dueBlockRaw(); const done=S.entries.some(e=>e.date===today()&&e.blockId===d.id); if(!done) return d;
  const tg=targetOf(today(),nowT()); return tg.date===today()?tg.b:d; }
function spanOf(b){ const bs=blocksSorted(); const i=bs.findIndex(x=>x.id===b.id); const from=i>0?bs[i-1].time:bs[bs.length-1].time; return from+'–'+b.time; }
function prevBlockTime(b){const bs=blocksSorted();const i=bs.findIndex(x=>x.id===b.id);return i>0?bs[i-1].time:null;}
// Avond = vanaf een uur voor je laatste herinnering, of na middernacht.
const isEveAt=t=>{const m=mins(t);return m>=mins(lastBlock().time)-60||m<240;};
const isEvening=x=>isEveAt(typeof x==='string'?x:x.time);
const keyOf=e=>e.date+'T'+e.time;
// Vorige check-in (max 24 uur terug). Zonder vorige: gisteravond bij je laatste herinnering.
function sinceTs(date,time){ const k=date+'T'+time, floor=addDays(date,-1)+'T'+time;
  const p=S.entries.filter(e=>!e.light&&keyOf(e)<k&&keyOf(e)>=floor).sort((a,b)=>keyOf(a).localeCompare(keyOf(b))).slice(-1)[0];
  return p?keyOf(p):addDays(date,-1)+'T'+lastBlock().time; }
function sinceLabel(date,ts){ const d=ts.slice(0,10),t=ts.slice(11,16); return d===date?'sinds '+t:d===addDays(date,-1)?(mins(t)>=mins(lastBlock().time)-60?'sinds gisteravond '+t:'sinds gisteren '+t):'sinds '+t; }
const inRange=(k,a,b)=>k>a&&k<=b;
// In welk blok valt een moment? Het tijdvak tot de volgende herinnering. Vul je tot een uur ná een herinnering in, dan telt het nog voor dat blok.
function blockAt(time,date){ const bs=blocksSorted(), t=mins(time); date=date||today();
  if(bs.length>1&&t<mins(bs[0].time)+120&&!S.entries.some(e=>!e.light&&e.date===date&&(e.time<time||e.blockId===bs[0].id))) return bs[0]; // eerste check-in van de ochtend gaat over je nacht
  const late=[...bs].reverse().find(b=>t>=mins(b.time)&&t<=mins(b.time)+60); if(late&&!S.entries.some(e=>!e.light&&e.date===date&&e.blockId===late.id)) return late;
  return bs.find(b=>t<mins(b.time))||bs[bs.length-1]; }
function nextBlockOf(b){ const bs=blocksSorted(); const i=bs.findIndex(x=>x.id===b.id); return i<bs.length-1?bs[i+1]:null; }
function windowOf(b){ const bs=blocksSorted(); const i=bs.findIndex(x=>x.id===b.id); return (i>0?bs[i-1].time:bs[bs.length-1].time)+'–'+b.time; }
// Herinneringen die voorbij zijn zonder check-in, sinds je vorige check-in.
function missedBlocks(date,time,since){ const n=mins(time);
  const first=blocksSorted()[0]; return blocksSorted().filter(b=>{ if(b.id===first.id) return false; const k=date+'T'+b.time; return k>since&&mins(b.time)+60<n&&!S.entries.some(e=>e.date===date&&e.blockId===b.id&&Object.keys(e.ans||{}).length); }); }
function nextReminder(){ const n=mins(nowT()); const b=blocksSorted().find(x=>mins(x.time)>n); return b?b.time:null; }
// Een blok is een tijdvak: van de vorige bloktijd tot zijn eigen tijd. Het eerste blok (de nacht) begint bij het laatste blok van gisteren.
function targetOf(date,time){ const bs=blocksSorted(); const t=mins(time); const b=bs.find(x=>t<mins(x.time)); return b?{date,b}:{date:addDays(date,1),b:bs[0]}; }

// Iets wat je achteraf logt, komt bij de eerste check-in ná dat moment (als die er al is). Anders bij je volgende check-in.
function attachDeed(ev){ const k=ev.ts.slice(0,16), lim=addDays(ev.date,1)+'T'+ev.ts.slice(11,16);
  const en=S.entries.filter(e=>keyOf(e)>=k&&keyOf(e)<=lim).sort((a,b)=>keyOf(a).localeCompare(keyOf(b)))[0]; if(!en) return null;
  ev.acts.forEach(n=>{ if(!en.acts.includes(n)) en.acts.push(n); }); (ev.love||[]).forEach(n=>{ en.love=en.love||[]; if(!en.love.includes(n)) en.love.push(n); });
  if(ev.actFeel){ en.actFeel={...(en.actFeel||{}),...ev.actFeel}; } ev.attached=en.id; return en; }

/* ================= Thema ================= */
function applyTheme(){
  let t=S.settings.theme||'auto';
  if(t==='auto'){const h=new Date().getHours();t=(h>=19||h<6)?'nacht':'dag';}
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name=theme-color]').content=t==='nacht'?'#262A3D':'#F5EFE3';
}

/* ================= Activiteiten ================= */
const REST_RE=/gaming|game|gamen|\btv\b|series|movie|read|lezen|crochet|haken|blanket|deken|relax|tea|thee|bath|music|muziek|nap|dutje|in bed|bank|rust/i;
const WEATHER_RE=/sun|cloud|wind|warm|rain|cold|heat|summer|winter|storm|snow|fog|weer/i;
function ensureAct(n){ if(!S.acts[n]&&typeof GDEF!=='undefined'&&S.groupsV4){ for(const [g,ns] of Object.entries(GDEF)) if(ns.includes(n)){ S.acts[n]={feel:null,spoon:null,rest:g==='rust'||g==='herstel',weather:g==='weer',hidden:false,g}; break; } }
  if(!S.acts[n]) S.acts[n]={feel:null,spoon:null,rest:REST_RE.test(n)||S.rest.some(r=>r.n===n),weather:WEATHER_RE.test(n),hidden:false}; return S.acts[n]; }
const isRest=n=>{const a=S.acts[n];return (a&&a.rest)||S.rest.some(r=>r.n===n);};
// Dubbele namen: deze tellen voortaan als één activiteit. Hoofdletters maken niet uit.
const ALIAS0={'Groggy':'groggy','Psycholoog':'psycholoog','Zwemles Avery':'zwemles','Boodschappen bestellen':'boodschappen besteld','delivery':'Boodschappen bezorgd','Avery':'Avery bij ons'};
function aliasOf(n){ if(!n) return n; n=String(n).trim(); const m=(S.alias&&S.alias[n])||ALIAS0[n]; if(m) return m; if(S.acts[n]) return n;
  const lo=n.toLowerCase(); return Object.keys(S.acts).find(k=>k.trim().toLowerCase()===lo)||n; }
function cleanV6(){ if(S.cleanV6>=3) return;

// Uit je "ongesteld"-vinkjes: de eerste dag na minstens 10 dagen zonder telt als start.
function cycleStarts(){ const c=cache(); if(c.cy) return c.cy; const ds=[...new Set(S.entries.filter(e=>(e.acts||[]).includes('ongesteld')).map(e=>e.date))].sort(); const st=[];

  if(next){ const to=Math.round((new Date(next)-new Date(date))/864e5); if(to>=1&&to<=4) return 'dagen voor je ongesteld wordt'; }
  else if(prev){ const day=Math.round((new Date(date)-new Date(prev))/864e5); if(day<=len+7&&len-day>=1&&len-day<=4) return 'dagen voor je ongesteld wordt'; }
  if(prev){ const day=Math.round((new Date(date)-new Date(prev))/864e5); if(day<=len+7&&day<=4) return 'eerste dagen van je cyclus'; }
  return null; }

function normActs(list){ const out=[]; for(const n of list||[]){ const m=Object.prototype.hasOwnProperty.call(ACTMAP,n)?ACTMAP[n]:n; if(m==null) continue; for(const x of [].concat(m)) if(!out.includes(x)) out.push(x); } return out; }
function migrateGroups(){
  if(S.groupsV4) return;
  S.groups=GROUPS0.map(g=>({...g}));
  const ren=list=>normActs(list);
  for(const e of S.entries){ e.acts=ren(e.acts); e.love=ren(e.love).filter(n=>e.acts.includes(n)); if(e.actFeel){const f={}; for(const [k,v] of Object.entries(e.actFeel)){const m=ren([k]); if(m[0]) f[m[0]]=v;} e.actFeel=f;} }
  for(const e of S.events){ if(e.acts) e.acts=ren(e.acts); if(e.love) e.love=ren(e.love); }
  const old=S.acts; S.acts={};
  for(const [n,a] of Object.entries(old)){ for(const t of ren([n])){ const b=S.acts[t]; if(!b){ S.acts[t]={...a}; } else { if(b.feel==null&&a.feel!=null) b.feel=a.feel; b.rest=b.rest||a.rest; if(b.spoon==null&&a.spoon!=null) b.spoon=a.spoon; } } }
  S.rest=S.rest.map(r=>({...r,n:ren([r.n])[0]||r.n})).filter((r,i,arr)=>arr.findIndex(x=>x.n===r.n)===i);
  for(const [g,names] of Object.entries(GDEF)) for(const n of names){ const a=ensureAct(n); a.g=g; a.weather=g==='weer'; a.rest=g==='rust'||g==='herstel'; }
  for(const n in S.acts){ const a=S.acts[n]; if(!a.g&&a.weather) a.g='weer'; }
  if(S.acts['Horse Nation']){ S.acts['Horse Nation'].rest=true; }
  ['loopband','zonnen'].forEach(n=>{ if(S.acts[n]&&n==='loopband') S.acts[n].rest=false; });
  if(S.acts['haken']) S.acts['haken'].rest=true;
  S.groupsV4=true; C=null;
}

function reassignBlocks(){

  S.entries.filter(e=>e.source!=='daylio'&&!e.light).forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  for(const es of Object.values(by)){ es.sort((a,b)=>a.time.localeCompare(b.time)); const used=new Set();
    es.forEach((e,i)=>{ const t=mins(e.time); let b=null;
      if(i===0&&t<mins(bs[0].time)+120) b=bs[0];
      if(!b) b=[...bs].reverse().find(x=>t>=mins(x.time)&&t<=mins(x.time)+60&&!used.has(x.id));
      if(!b) b=bs.find(x=>t<mins(x.time))||bs[bs.length-1];
      e.blockId=b.id; used.add(b.id); }); }
  S.blocksV5=true; C=null;
}

function groupPicker(box,st,blockId,opt){
  opt=opt||{}; st.feel=st.feel||{}; let f='', open={}, adding=null;
  const order=topActs(blockId); const rank=new Map(order.map((n,i)=>[n,i]));
  const sortN=a=>a.sort((x,y)=>(rank.has(x)?rank.get(x):1e4)-(rank.has(y)?rank.get(y):1e4)||x.localeCompare(y));
  const visible=n=>S.acts[n]&&!S.acts[n].hidden;
  function chip(n,ctx){const on=st.on.has(n),lv=st.love.has(n);return `<button class="chip ${lv?'love':on?'on':''}" data-n="${esc(n)}" ${ctx?'data-ctx="1"':''}>${esc(n)}${lv?' ♥':''}${!ctx&&isRest(n)?' <span class="leaf">🍃</span>':''}</button>`;}
  function groupHTML(g,names){ const ctx=!!g.ctx; const sel=names.filter(n=>st.on.has(n)); const top=names.slice(0,ctx?20:8); const show=open[g.id]?names:[...new Set([...top,...sel])]; const more=names.length-show.length;
    return `<div class="grp" data-g="${g.id}"><div class="gh"><b>${esc(g.name)}</b>${g.single?'<span class="muted">kies er één</span>':''}</div><div class="chips">${show.map(n=>chip(n,ctx)).join('')}${more>0?`<button class="chip add" data-more="${g.id}">+ ${more} meer</button>`:open[g.id]&&names.length>(ctx?20:8)?`<button class="chip add" data-more="${g.id}">minder</button>`:''}<button class="chip add" data-new="${g.id}">+ nieuw</button></div>${adding&&adding.g===g.id?newHTML(g):''}</div>`; }
  function newHTML(g){ const a=adding; return `<div class="card newact" style="gap:8px;margin-top:6px"><input type="text" class="nn" placeholder="Naam" value="${esc(a.n||'')}">${g.ctx?'':`<span class="muted">Meestal…</span><div class="opts np">${[[-1,'zwaar'],[0,'neutraal'],[1,'positief'],['var','wisselt']].map(([v,t])=>`<button class="opt ${a.feel===v?'on':''}" data-v="${v}">${t}</button>`).join('')}</div><button class="chip nr ${a.rest?'on':''}" style="align-self:flex-start">🍃 dit is rust</button>`}<div class="row"><button class="btn small ns">Toevoegen</button><button class="btn ghost small nx">Annuleren</button></div></div>`; }
  function draw(){
    const groups=S.groups.filter(g=>!g.inline&&(opt.ctx?g.ctx:!g.ctx));
    let h='';
    if(!opt.ctx) h+=`<div class="row"><input type="text" class="grow f" placeholder="Zoeken…" value="${esc(f)}"></div>`;
    if(f){ const hits=Object.keys(S.acts).filter(n=>visible(n)&&!isCtx(n)&&n.toLowerCase().includes(f)); sortN(hits);
      h+=`<div class="chips" style="margin-top:8px">${hits.map(n=>chip(n,false)).join('')||'<span class="muted">Niks gevonden. Voeg het toe bij de groep waar het hoort, met + nieuw.</span>'}</div>`;
    } else {
      for(const g of groups){ const names0=Object.keys(S.acts).filter(n=>visible(n)&&grpOf(n)===g.id); const names=g.single?names0:sortN(names0); h+=groupHTML(g,names); }
      if(!opt.ctx){ const loose=sortN(Object.keys(S.acts).filter(n=>visible(n)&&!grpOf(n)&&!isCtx(n)&&!TUSSEN0.includes(n))); if(loose.length) h+=groupHTML({id:'_overig',name:'Overig'},loose); }
    }
    h+=opt.ctx?'':sliderHTML(st);
    box.innerHTML=h;
    const i=box.querySelector('.f'); if(i) i.oninput=()=>{f=i.value.trim().toLowerCase();draw();const j=box.querySelector('.f');j.focus();j.setSelectionRange(j.value.length,j.value.length);};
    box.querySelectorAll('.chip[data-n]').forEach(b=>b.onclick=()=>{const n=b.dataset.n;
      if(b.dataset.ctx){ const g=grpById(grpOf(n)); if(st.on.has(n)) st.on.delete(n); else { if(g&&g.single) Object.keys(S.acts).filter(x=>grpOf(x)===g.id).forEach(x=>st.on.delete(x)); st.on.add(n);} draw(); return; }
      if(isVar(n)){ if(st.on.has(n)){st.on.delete(n);delete st.feel[n];} else {st.on.add(n); st.feel[n]=0;} draw(); return; }
      if(st.love.has(n)){st.love.delete(n);st.on.delete(n);}else if(st.on.has(n))st.love.add(n);else st.on.add(n); draw();});
    box.querySelectorAll('[data-sl]').forEach(r=>r.oninput=()=>{st.feel[r.dataset.sl]=+r.value/100;});
    box.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{open[b.dataset.more]=!open[b.dataset.more];draw();});
    box.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{adding={g:b.dataset.new,n:'',feel:null,rest:b.dataset.new==='rust'||b.dataset.new==='herstel'};draw(); const x=box.querySelector('.nn'); if(x) x.focus();});
    const na=box.querySelector('.newact'); if(na){
      na.querySelector('.nn').oninput=e=>{adding.n=e.target.value;};
      na.querySelectorAll('.np .opt').forEach(o=>o.onclick=()=>{adding.feel=o.dataset.v==='var'?'var':+o.dataset.v;draw();});
      const nr=na.querySelector('.nr'); if(nr) nr.onclick=()=>{adding.rest=!adding.rest;draw();};
      na.querySelector('.nx').onclick=()=>{adding=null;draw();};
      na.querySelector('.ns').onclick=()=>{const n=(adding.n||'').trim(); if(!n) return toast('Geef het eerst een naam');
        const a=ensureAct(n); a.g=adding.g==='_overig'?null:adding.g; a.hidden=false; a.weather=adding.g==='weer';
        if(!grpById(adding.g)||!grpById(adding.g).ctx){ a.feel=adding.feel; a.feelAuto=false; a.rest=adding.rest; }
        const g=grpById(adding.g); if(g&&g.single) Object.keys(S.acts).filter(x=>grpOf(x)===g.id).forEach(x=>st.on.delete(x));
        st.on.add(n); if(a.feel==='var') st.feel[n]=0; adding=null; save(); C=null; draw(); toast('Toegevoegd');};
    }
  }
  draw();
}

const POSW=new Set(['happy','content','relaxed','grateful','energized','excited','graceful']);
const NEGW=new Set(['stressed','anxious','annoyed','sad','crying','angry','frustrated','hateful','conflicted','unsure','overwhelmed','autistic meltdown']);
const COSTW=new Set(['tired','exhausted','overwhelmed','noise sensitive','groggy','restless','rushed','autistic twitch','autistic meltdown','autistic shutdown','body unease','done']);
const qById=id=>S.questions.find(q=>q.id===id);
function raw(e){
  const V=[],Cc=[];
  for(const [id,x] of Object.entries(e.ans||{})){ const q=qById(id); if(!q||x==null) continue;
    if(q.type==='gevoel'){ V.push(2*x-1); if(id==='stemming') V.push(2*x-1); }
    else if(q.type==='kost') Cc.push(1-x); }
  const w=e.words||[]; if(w.length){const wv=w.filter(x=>POSW.has(x)).length-w.filter(x=>NEGW.has(x)).length; V.push(Math.max(-1,Math.min(1,wv*0.4))); if(w.some(x=>COSTW.has(x))) Cc.push(0.8);}

function doneToday(date){
  const m=new Map();
  entriesOn(date).forEach(e=>(e.acts||[]).forEach(n=>{ if(isCtx(n)) return; m.set(n,m.get(n)||(e.love||[]).includes(n)); }));
  S.events.filter(e=>e.kind==='deed'&&e.date===date).forEach(e=>e.acts.forEach(n=>!isCtx(n)&&m.set(n,m.get(n)||(e.love||[]).includes(n))));
  hrDoneOn(date).forEach(x=>{ if(!m.has(x.n)) m.set(x.n,false); });
  calEventsOn(date).filter(e=>mins(e.e)<=mins(date===today()?nowT():'23:59')).forEach(e=>{ if(!m.has(e.title)) m.set(e.title,(S.ratings[e.id]||{}).v===1); });
  return [...m];
}

/* ---- Gedaan per blok ---- */
function doneByBlock(date){
  const items=[]; const inEntry=new Set();
  entriesOn(date).forEach(e=>(e.acts||[]).forEach(n=>{ inEntry.add(n); if(isCtx(n)) return; items.push({src:'entry',id:e.id,n,love:(e.love||[]).includes(n),b:e.blockId,t:e.time,light:!!e.light}); }));
  S.events.filter(e=>e.kind==='deed'&&e.date===date&&!e.attached).forEach(e=>e.acts.forEach(n=>items.push({src:'deed',id:e.id,n,love:(e.love||[]).includes(n),b:e.blockId||blockAt(e.ts.slice(11,16),date).id,pending:true,t:'straks'})));
  calEventsOn(date).filter(e=>!inEntry.has(e.title)&&!(S.calPlaced||{})[e.id]&&mins(e.e)<=mins(date===today()?nowT():'23:59')).forEach(e=>items.push({src:'cal',id:e.id,n:e.title,love:(S.ratings[e.id]||{}).v===1,b:blockAt(e.e,date).id,pending:true}));
  hrDoneOn(date).filter(x=>!S.hrSeen[x.key]&&!inEntry.has(x.n)).forEach(x=>items.push({src:'hr',id:x.key,n:x.n,love:false,b:null,pending:true,hr:x}));
  return items;
}
function removeItem(it,date){
  if(it.src==='entry'){ const e=S.entries.find(x=>x.id===it.id); if(!e) return; e.acts=e.acts.filter(n=>n!==it.n); e.love=(e.love||[]).filter(n=>n!==it.n); if(e.actFeel) delete e.actFeel[it.n];
    if(e.light&&!e.acts.length&&!Object.keys(e.ans||{}).length) S.entries=S.entries.filter(x=>x!==e); }
  else if(it.src==='deed'){ const ev=S.events.find(x=>x.id===it.id); if(!ev) return; ev.acts=ev.acts.filter(n=>n!==it.n); if(!ev.acts.length) S.events=S.events.filter(x=>x!==ev); }
  else if(it.src==='cal'){ S.calPlaced=S.calPlaced||{}; S.calPlaced[it.id]=1; }
  else if(it.src==='hr'){ S.hrSeen[it.id]=1; }
}
function moveItem(it,date,bid){
  removeItem(it,date); if(it.hr) ensureHrAct(it.hr); ensureAct(it.n);
  const b=S.blocks.find(x=>x.id===bid);
  let e=S.entries.filter(x=>x.date===date&&x.blockId===bid).sort((a,c)=>Object.keys(c.ans||{}).length-Object.keys(a.ans||{}).length)[0];
  if(!e){ e={id:uid(),source:'lately',light:true,date,time:b.time,blockId:bid,ans:{},acts:[],love:[],words:[],note:''}; S.entries.push(e); }
  if(!e.acts.includes(it.n)) e.acts.push(it.n); if(it.love&&!(e.love||[]).includes(it.n)){ e.love=e.love||[]; e.love.push(it.n); }
}
function doneCardHTML(date){
  const items=doneByBlock(date); if(!items.length) return '<p class="muted">Nog niks. Ook rust telt.</p>';
  const chip=(it,i)=>`<button class="chip ${it.love?'love':''} ${it.pending?'pend':''}" data-it="${i}">${esc(it.n)}${it.love?' ♥':''}</button>`;
  let h=blocksSorted().map(b=>{ const xs=items.map((it,i)=>[it,i]).filter(([it])=>it.b===b.id); if(!xs.length) return '';
    // meerdere check-ins in één blok: elk een eigen klein blokje met de tijd
    const keys=[...new Set(xs.map(([it])=>it.src==='entry'&&!it.light?it.t:it.src==='entry'?'':it.t||''))];
    const sub=keys.filter(k=>k&&k!=='straks').length>1;
    const body=sub?keys.sort((a,c)=>(a||'99').localeCompare(c||'99')).map(k=>{ const ys=xs.filter(([it])=>(it.src==='entry'&&!it.light?it.t:it.src==='entry'?'':it.t||'')===k);
        return `<div class="sub"><span class="st">${k==='straks'?'nog in te checken':k||'later verplaatst'}</span><div class="chips">${ys.map(([it,i])=>chip(it,i)).join('')}</div></div>`; }).join('')
      :`<div class="chips">${xs.map(([it,i])=>chip(it,i)).join('')}</div>`;
    return `<div class="dblk"><div class="kv"><span class="dl">${esc(b.label)}</span><span class="muted">${windowOf(b)}</span></div>${body}</div>`; }).join('');
  const loose=items.map((it,i)=>[it,i]).filter(([it])=>!it.b);
  if(loose.length) h+=`<div class="dblk"><div class="kv"><span class="dl">Nog geen blok</span><span class="muted">uit Huisritme</span></div><div class="chips">${loose.map(([it,i])=>chip(it,i)).join('')}</div></div>`;
  return h+`<p class="muted">Tik op iets om het naar een ander blok te zetten. Gestippeld komt bij je volgende check-in.</p>`;
}
function bindDone(root,date,re){
  const items=doneByBlock(date);
  root.querySelectorAll('[data-it]').forEach(c=>c.onclick=()=>{ const it=items[+c.dataset.it]; const cur=S.blocks.find(b=>b.id===it.b);
    sheet(`<h2>${esc(it.n)}</h2><p class="muted">${cur?`Staat nu bij je ${esc(cur.label.toLowerCase())} (${windowOf(cur)}).`:'Staat nog niet in een blok.'} Waar hoort het bij?</p>
      <div class="stack">${blocksSorted().map(b=>`<button class="btn ${b.id===it.b?'':'ghost'}" data-to="${b.id}">${esc(b.label)} <span style="opacity:.7;font-weight:400">${windowOf(b)}</span></button>`).join('')}</div>
      <button class="btn ghost" id="itDel">Weghalen, klopt niet</button>`,(el,close)=>{
      el.querySelectorAll('[data-to]').forEach(x=>x.onclick=()=>{ if(x.dataset.to!==it.b){ moveItem(it,date,x.dataset.to); save(); toast('Verplaatst naar je '+S.blocks.find(b=>b.id===x.dataset.to).label.toLowerCase()); } close(); re(); });
      el.querySelector('#itDel').onclick=()=>{ removeItem(it,date); save(); close(); toast('Weggehaald'); re(); };
    }); });
}

/* ================= Even vragen ================= */
function needAsk(){
  const d=today(); if(S.asked.last&&S.asked.last>=addDays(d,-2)) return false;
  const days=[addDays(d,-1),addDays(d,-2)];
  const counts=days.map(x=>entriesOn(x).length+S.events.filter(e=>e.date===x).length);
  if(S.entries.filter(e=>e.source==='lately').length<10) return false; // eerst even wennen
  if(counts.every(n=>n<=2)) return 'weinig';
  const acts=days.flatMap(x=>doneToday(x).map(([n])=>n)); const allEntries=days.flatMap(x=>entriesOn(x));
  if(acts.length>=4){const c={};acts.forEach(n=>c[n]=(c[n]||0)+1);const top=Math.max(...Object.values(c));if(top/acts.length>=0.5) return 'hetzelfde';}
  const sig=allEntries.map(e=>JSON.stringify(e.ans)); if(sig.length>=4&&new Set(sig).size===1) return 'hetzelfde';
  return false;
}

/* ================= Daylio-import ================= */
const MOOD={rad:1,good:.75,meh:.5,bad:.25,awful:0};
const LV={low:0,stable:1,high:2};
const LOADW=new Set(['noise sensitive','overwhelmed','autistic twitch','autistic meltdown','autistic shutdown','body unease']);
const MOODW=new Set(['tired','done','stressed','okay','content','anxious','annoyed','groggy','exhausted','restless','happy','unsure','relaxed','conflicted','sad','grateful','crying','energized','rushed','angry','frustrated','graceful','hateful','excited']);
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c=='"')q=true;else if(c==','){row.push(f);f='';}
  else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!='\r')f+=c;} if(f||row.length){row.push(f);rows.push(row);} return rows;}
function importDaylio(text){
  const rows=parseCSV(text.replace(/^﻿/,'')); const h=rows.shift().map(x=>x.trim()); const ix=k=>h.indexOf(k);
  const iD=ix('full_date'),iT=ix('time'),iM=ix('mood'),iA=ix('activities'),iN=ix('note'),iNT=ix('note_title');
  if(iD<0||iA<0) throw new Error('Dit lijkt geen Daylio-CSV');
  const have=new Set(S.entries.filter(e=>e.source==='daylio').map(e=>e.date+' '+e.time)); let n=0;
  for(const r of rows){ if(!r[iD]) continue; const date=r[iD].trim(), time=(r[iT]||'12:00').trim().slice(0,5); if(have.has(date+' '+time)) continue;
    const toks=(r[iA]||'').split('|').map(x=>x.trim()).filter(Boolean); const lv=[null,null,null,null]; let si=0,lw=null; const acts=[],words=[];
    for(const t of toks){
      if(t in LV){ if(lw==='A'&&si<2) si=2; else if(lw==='M'&&si<3) si=3; if(si<4) lv[si]=LV[t]; si++; lw=null; }
      else if(LOADW.has(t)){words.push(t);lw='A';if(si<2)si=2;} else if(MOODW.has(t)){words.push(t);lw='M';if(si<3)si=3;}
      else if(!acts.includes(t)) acts.push(t); }
    const nacts=S.groupsV4?normActs(acts):acts; acts.length=0; acts.push(...nacts); acts.forEach(ensureAct);
    const ans={}; if(lv[0]!=null) ans.energie=lv[0]/2; if(lv[1]!=null) ans.prikkels=1-lv[1]/2; if(lv[3]!=null) ans.somber=1-lv[3]/2;
    const mo=(r[iM]||'').trim(); if(mo in MOOD) ans.stemming=MOOD[mo];
    S.entries.push({id:uid(),source:'daylio',date,time,blockId:blockFor(time).id,ans,acts,love:[],words,note:[r[iNT],r[iN]].filter(x=>x&&x.trim()).join(' — ').replace(/<[^>]+>/g,' ').trim()});
    n++; }
  save(); return n;
}

function sheet(html,mount){const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML=`<div class="sheet"><div class="handle"></div>${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});document.body.appendChild(bg);mount&&mount(bg.querySelector('.sheet'),()=>bg.remove());}
function ask(msg,yes,cb){sheet(`<h3>${esc(msg)}</h3><div class="row"><button class="btn ghost" id="aN">Annuleren</button><button class="btn" id="aY">${esc(yes)}</button></div>`,(el,close)=>{el.querySelector('#aN').onclick=close;el.querySelector('#aY').onclick=()=>{close();cb();};});}
function topActs(blockId,limit){
  const c={}; S.entries.filter(e=>e.blockId===blockId&&e.date>=addDays(today(),-120)).forEach(e=>(e.acts||[]).forEach(n=>c[n]=(c[n]||0)+1));
  S.entries.forEach(e=>(e.acts||[]).forEach(n=>c[n]=(c[n]||0)+.01)); S.events.forEach(e=>(e.acts||[]).forEach(n=>c[n]=(c[n]||0)+.5));
  Object.keys(S.acts).forEach(n=>{if(!(n in c))c[n]=0;});
  return Object.keys(c).filter(n=>!(S.acts[n]&&(S.acts[n].hidden||S.acts[n].weather))).sort((a,b)=>c[b]-c[a]);
}

function picker(box,names,st,limit){ // tik: gedaan → gedaan + leuk → uit
  let f='', all=false, fresh=null; st.feel=st.feel||{};
  function chip(n){return `<button class="chip ${st.love.has(n)?'love':st.on.has(n)?'on':''}" data-n="${esc(n)}">${esc(n)}${st.love.has(n)?' ♥':''}</button>`;}
  function draw(){
    const top=names.slice(0,limit);
    const list=f?names.filter(n=>n.toLowerCase().includes(f)):top;
    const extra=f?[]:[...st.on].filter(n=>!list.includes(n));
    const rest=[...names].filter(n=>!top.includes(n)).sort((a,b)=>a.localeCompare(b));
    box.innerHTML=`<div class="chips">${[...list,...extra].map(chip).join('')}</div>
      ${f?'':`<button class="chip add" id="pAll" style="align-self:flex-start">${all?'minder tonen':'alle activiteiten tonen ('+rest.length+')'}</button>
      ${all?`<div class="chips" style="max-height:260px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:12px">${rest.map(chip).join('')}</div>`:''}`}
      <div class="row"><input type="text" class="grow f" placeholder="Zoek of voeg iets nieuws toe…" value="${esc(f)}">${f&&!names.some(n=>n.toLowerCase()===f)?'<button class="btn small add">+ Nieuw</button>':''}</div>
      ${fresh?propsHTML(fresh):''}${sliderHTML(st)}`;
    const pa=box.querySelector('#pAll'); if(pa) pa.onclick=()=>{all=!all;draw();};
    box.querySelectorAll('.chip[data-n]').forEach(b=>b.onclick=()=>{const n=b.dataset.n;
      if(isVar(n)){ if(st.on.has(n)){st.on.delete(n);delete st.feel[n];} else {st.on.add(n); st.feel[n]=0;} draw(); return; }
      if(st.love.has(n)){st.love.delete(n);st.on.delete(n);}else if(st.on.has(n))st.love.add(n);else st.on.add(n); draw();});
    box.querySelectorAll('[data-sl]').forEach(r=>r.oninput=()=>{st.feel[r.dataset.sl]=+r.value/100;});
    const i=box.querySelector('.f'); i.oninput=()=>{f=i.value.trim().toLowerCase();draw();const j=box.querySelector('.f');j.focus();j.setSelectionRange(j.value.length,j.value.length);};
    const ad=box.querySelector('.add:not(#pAll)'); if(ad) ad.onclick=()=>{const raw=box.querySelector('.f').value.trim(); const a=ensureAct(raw); a.feel=null; a.rest=false; names.unshift(raw); st.on.add(raw); fresh=raw; f=''; save(); draw();};
    box.querySelectorAll('.np .opt').forEach(o=>o.onclick=()=>{const a=S.acts[fresh]; const v=o.dataset.v==='var'?'var':+o.dataset.v; a.feel=v; a.feelAuto=false; if(v==='var'){st.love.delete(fresh); st.feel[fresh]=0;} save(); draw();});
    const nr=box.querySelector('.nr'); if(nr) nr.onclick=()=>{const a=S.acts[fresh]; a.rest=!a.rest; save(); draw();};
  }
  draw();
}

function vGedaan(){
  const d=today(); let h=`<div class="stack"><div class="kv"><h1>Gedaan</h1><span class="muted">I did a thing!</span></div>`;
  h+=friendHTML(doneToday(d).length?`Kijk eens wat je vandaag al gedaan hebt. Alles telt, ook de rust.`:`Nog niks vandaag? Rust telt ook. Tik aan wat je deed, hoe klein ook.`);
  h+=`<button class="btn" id="gDid">I did a thing!</button><button class="btn ghost" id="gWeek">Terugblik op je week</button>`;
  for(let i=0;i<7;i++){const ds=addDays(d,-i); const done=doneToday(ds); if(!done.length&&i>0) continue;
    const rest=done.filter(([n])=>isRest(n)).length;
    h+=`<div class="card"><div class="kv"><h3>${i===0?'Vandaag':i===1?'Gisteren':fmtDate(ds)}</h3><span class="muted">${done.length} gedaan${rest?` · ${rest} rust`:''}</span></div>${miniDay(ds)}
      <div class="chips">${done.map(([n,l])=>`<span class="chip ${l?'love':''}">${esc(n)}${l?' ♥':''}</span>`).join('')||'<span class="muted">Nog niks.</span>'}</div>
      ${entriesOn(ds).length?`<div class="chips">${entriesOn(ds).map(e=>{const b=S.blocks.find(x=>x.id===e.blockId);return `<button class="chip add" data-edit="${e.id}">${esc(b?b.label:'check-in')} ${e.time} · aanpassen</button>`;}).join('')}</div>`:''}</div>`;}
  app.innerHTML=h+'</div>'; document.getElementById('gDid').onclick=()=>openDid();
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const e=S.entries.find(x=>x.id===b.dataset.edit); if(e) openCheckin(null,e);}); document.getElementById('gWeek').onclick=openWeek;
}

/* ================= Lijn & zware dagen ================= */
// Hoe zwaar een check-in was, 0 (licht) tot 1 (zwaar). Leuk-maar-vol telt half mee.
function heavyOf(p){ const d=Math.abs(p.x-50)/50; return p.x<50?d:d*.5; }
function dayData(){
  const c=cache(); if(c.dd) return c.dd; const an=analysis(); const by={};
  for(const e of an.E){ const p=an.Z.get(e); if(!p) continue; const d=by[e.date]=by[e.date]||{date:e.date,h:[],acts:new Set()}; d.h.push(heavyOf(p)); (e.acts||[]).forEach(n=>d.acts.add(n)); }
  // ook wat je losjes logde
  for(const ev of S.events) if(ev.kind==='deed'&&by[ev.date]) (ev.acts||[]).forEach(n=>by[ev.date].acts.add(n));
  for(const d of Object.values(by)) for(const n of extraFactors(d.date)) d.acts.add(n);
  const days=Object.values(by).sort((a,b)=>a.date.localeCompare(b.date)); days.forEach(d=>d.v=avg(d.h));
  const vs=days.map(d=>d.v).sort((a,b)=>a-b); const q=f=>vs.length?vs[Math.min(vs.length-1,Math.floor(f*vs.length))]:0;
  const hi=q(.67), lo=q(.33), med=q(.5); days.forEach(d=>{d.heavy=d.v>=hi; d.light=d.v<=lo;});
  const idx=new Map(days.map(d=>[d.date,d]));
  // wat samengaat met zware dagen, en met een zware dag erna
  const base=days.filter(d=>d.heavy).length/Math.max(1,days.length);
  const pairs=days.filter(d=>idx.has(addDays(d.date,1))); const baseN=pairs.filter(d=>idx.get(addDays(d.date,1)).heavy).length/Math.max(1,pairs.length);
  const cnt={}; for(const d of days) for(const n of d.acts){ if(!FACT.has(n)&&(!S.acts[n]||S.acts[n].hidden)) continue; const x=cnt[n]=cnt[n]||{n,days:0,heavy:0,light:0,pd:0,next:0}; x.days++; if(d.heavy)x.heavy++; if(d.light)x.light++; const nx=idx.get(addDays(d.date,1)); if(nx){x.pd++; if(nx.heavy)x.next++;} }
  const L=Object.values(cnt).filter(x=>x.days>=8&&x.days<=days.length-8);
  // rust en herstel pak je juist óp zware dagen, dus die tellen niet als oorzaak
  const resp=x=>isRest(x.n)||grpOf(x.n)==='herstel';
  const same=L.filter(x=>!resp(x)).map(x=>({...x,p:x.heavy/x.days})).filter(x=>x.p-base>=.12).sort((a,b)=>b.p-a.p).slice(0,8);
  const lighter=L.map(x=>({...x,p:x.heavy/x.days})).filter(x=>base-x.p>=.12).sort((a,b)=>a.p-b.p).slice(0,8);
  const next=L.filter(x=>x.pd>=8&&!resp(x)).map(x=>({...x,p:x.next/x.pd})).filter(x=>x.p-baseN>=.12).sort((a,b)=>b.p-a.p).slice(0,8);
  const pairs2=days.filter(d=>idx.has(addDays(d.date,2))); const baseN2=pairs2.filter(d=>idx.get(addDays(d.date,2)).heavy).length/Math.max(1,pairs2.length);
  return c.dd={days,hi,lo,med,base,baseN,baseN2,same,lighter,next,idx,cnt};
}

    if(order.length>=2) h+=`<div class="card"><h3>Seizoenen</h3><p class="muted">Per seizoen: hoe vaak je echt aan de zware kant zat, en hoe vaak op je plek. Het is nu ${now}.</p><ul class="list">${order.map(k=>`<li style="flex-direction:row;justify-content:space-between"><span>${k===now?'<b>'+k+'</b>':k}</span><span class="muted">${Math.round(se[k].z/se[k].n*100)}% zwaar · ${Math.round(se[k].g/se[k].n*100)}% op je plek</span></li>`).join('')}</ul></div>`; }
  if(an.recov.length) h+=`<div class="card"><h3>Wat je terugbrengt</h3><p class="muted">Na een zwaar moment overdag was je het blok erna vaker weer oké met:</p><div class="chips">${an.recov.slice(0,6).map(r=>`<span class="chip">${esc(r.n)}</span>`).join('')}</div></div>`;
  // week
  const d=today(); const cells=[];
  for(let i=6;i>=0;i--){const ds=addDays(d,-i); const es=entriesOn(ds); const zs=es.map(e=>pos(e)).filter(Boolean);
    let cls=''; if(zs.length){const r=zs.filter(z=>z.zone==='rl'||z.zone==='rr').length/zs.length, g=zs.filter(z=>z.zone==='g').length/zs.length; cls=r>=.5?'zr':g>=.5?'zg':'zo';}
    cells.push(`<div><i class="${cls}"></i><span class="muted">${DAG[new Date(ds+'T12:00').getDay()].slice(0,2)}</span></div>`);}
  h+=`<div class="card"><h3>Je week</h3><p class="muted">Hoe je dagen liepen. Zonder punten en zonder vergelijken.</p><div class="week">${cells.join('')}</div></div>`;
  h+=`<p class="muted">Een patroon is geen oordeel. Hoe langer je Lately gebruikt, hoe beter ik je ken.</p></div>`;
  app.innerHTML=h; bindLine();
}

function varStats(n){ const v=[]; S.entries.forEach(e=>{if(e.actFeel&&e.actFeel[n]!=null) v.push(e.actFeel[n]);}); S.events.forEach(e=>{if(e.actFeel&&e.actFeel[n]!=null) v.push(e.actFeel[n]);});
  if(!v.length) return 'nog geen keer ingevuld'; const a=avg(v); const heavy=v.filter(x=>x<-.25).length, fine=v.filter(x=>x>.25).length;
  return `${v.length}× · ${heavy}× zwaar, ${fine}× fijn · meestal ${a<-.25?'zwaar':a>.25?'fijn':'gemengd'}`; }
function walk(){
  const cnt={}; S.entries.forEach(e=>(e.acts||[]).forEach(n=>cnt[n]=(cnt[n]||0)+1));
  const queue=Object.keys(S.acts).filter(n=>S.acts[n].feel==null&&!S.acts[n].hidden&&!isCtx(n)).sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)); let i=0;
  sheet('<div id="wk" class="stack"></div>',(el,close)=>{
    function draw(){ const box=el.querySelector('#wk');
      if(i>=queue.length){box.innerHTML='<h2>Klaar</h2><p>Alles is langsgegaan. Aanpassen kan altijd bij Activiteiten.</p><button class="btn" id="wD">Sluiten</button>';box.querySelector('#wD').onclick=()=>{close();vInst();};return;}
      const n=queue[i], a=S.acts[n];
      box.innerHTML=`<p class="muted">${i+1} van ${queue.length}</p><h2>${esc(n)}</h2><p class="muted">${cnt[n]||0}× gebruikt</p>
        <div class="q"><span class="l">Meestal…</span><div class="opts" id="wF">${[[-1,'negatief'],[0,'neutraal'],[1,'positief'],['var','wisselt']].map(([v,t])=>`<button class="opt" data-v="${v}" style="padding:16px 2px">${t}</button>`).join('')}</div><p class="muted">Wisselt: dan vraag ik het elke keer met een schuifje, zodra je het aantikt.</p></div>
        <button class="chip ${a.rest?'on':''}" id="wR" style="align-self:flex-start">dit is rust</button>
        <div class="row"><button class="btn ghost" id="wB">Terug</button><button class="btn ghost" id="wS">Overslaan</button><button class="btn ghost" id="wX">Stoppen</button></div>`;
      box.querySelectorAll('#wF .opt').forEach(b=>b.onclick=()=>{a.feel=b.dataset.v==='var'?'var':+b.dataset.v;a.feelAuto=false;save();i++;draw();});
      box.querySelector('#wR').onclick=()=>{a.rest=!a.rest;save();draw();};
      box.querySelector('#wS').onclick=()=>{i++;draw();}; box.querySelector('#wB').onclick=()=>{if(i>0){i--;draw();}}; box.querySelector('#wX').onclick=()=>{close();vInst();};
    } draw(); });
}
document.getElementById('fileCsv').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const n=importDaylio(await f.text());toast(n+' check-ins geïmporteerd');render();}catch(err){toast(err.message);}e.target.value='';};
document.getElementById('fileJson').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.blocks)throw new Error('Geen Lately-back-up');S=d;fill();migrateGroups();cleanV6();C=null;save();toast('Back-up teruggezet');render();}catch(err){toast(err.message);}e.target.value='';};

/* ---- Huisritme (zelfde account, dus zelfde opslag op je telefoon) ---- */
function hrRead(k){try{const v=localStorage.getItem('huisritme:'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function hrTasks(){const t=hrRead('huisritme-tasks'); if(Array.isArray(t)) return t; return (S.hrCache&&S.hrCache.tasks)||[];}
function hrDoneOn(date){return hrTasks().filter(t=>Array.isArray(t.completions)&&t.completions.includes(date)&&t.name).map(t=>({n:t.name,energy:t.energy,dur:t.durationMinutes,key:(t.id||t.name)+'|'+date}));}
function ensureHrAct(x){const a=ensureAct(x.n); a.hr=true; if(!a.g) a.g='huis'; if(a.spoon==null&&x.energy) a.spoon=-Math.min(5,Math.max(1,+x.energy||1));}
function hrAway(){const a=hrRead('huisritme-away')||(S.hrCache&&S.hrCache.awayPeriods)||[]; return Array.isArray(a)?a.filter(x=>x&&x.from&&x.to):[];}
function hrRhythm(){const r=hrRead('huisritme-dayrhythm'); if(r&&r.wake) return r; const c=S.hrCache; return c&&c.wakeTime?{wake:c.wakeTime,bed:c.bedTime}:null;}
const VAK_RE=/vakantie|studiedag|vrije dag|geen school|school vrij|margedag/i;
function noSchoolOn(date){
  if(S.noSchool[date]) return true;
  if(hrAway().some(p=>p.from<=date&&date<=p.to)) return true;
  return (S.cal.events||[]).some(e=>e.allDay&&VAK_RE.test(e.title)&&dstr(new Date(e.start))<=date&&date<dstr(new Date(e.end)));
}
const HOBBY_RE=/zwem|judo|voetbal|turn|dans|ballet|hockey|tennis|scouting|muziekles|pianoles|gitaarles|sport/i;
function hobbyLike(t){return HOBBY_RE.test(t)||S.week.hobbies.some(h=>h.name&&t.toLowerCase().includes(h.name.toLowerCase().split(' ')[0]));}
const calIgnored=t=>(S.calIgnore||[]).some(w=>w&&String(t).toLowerCase().includes(w.toLowerCase()));
function calEventsOn(date){
  return (S.cal.events||[]).filter(e=>!e.allDay&&!calIgnored(e.title)&&dstr(new Date(e.start))===date).map(e=>({id:e.id,title:e.title,s:tstr(new Date(e.start)),e:tstr(new Date(e.end))}));
}
function dayPlan(date){ // agenda + weekritme, dubbel telt één keer
  const wd=new Date(date+'T12:00').getDay(); const ev=calEventsOn(date); const out=ev.map(e=>({...e,src:'agenda'}));
  const sc=S.week.school[wd];
  if(sc&&sc.from&&sc.to&&!noSchoolOn(date)) out.push({title:'Avery naar school',s:sc.from,e:sc.to,src:'weekritme'});
  for(const h of S.week.hobbies.filter(h=>+h.day===wd)){
    const dup=ev.some(e=>(hobbyLike(e.title)&&e.title.toLowerCase().includes((h.name||'').toLowerCase().split(' ')[0]))||(mins(e.s)<mins(h.to)&&mins(h.from)<mins(e.e)&&hobbyLike(e.title)));
    if(!dup) out.push({title:h.name,s:h.from,e:h.to,src:'weekritme'});
  }
  return out.sort((a,b)=>a.s.localeCompare(b.s));
}

/* ---- Dropbox (hergebruikt de koppeling van Huisritme) ---- */
const DBX_ID='k2a2fputgkhil79', DBX_FILE='/lately-data.json', DBX_OWN='lately-dropbox-refresh-token';
const dbxRT=()=>localStorage.getItem(DBX_OWN)||localStorage.getItem('huisritme-dropbox-refresh-token');
const dbxRedirect=()=>location.origin+location.pathname.replace(/index\.html$/,'');
function b64url(u8){let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function dbxConnect(){
  const ver=b64url(crypto.getRandomValues(new Uint8Array(48))); localStorage.setItem('lately-dropbox-verifier',ver);
  const ch=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver))));
  const u=new URL('https://www.dropbox.com/oauth2/authorize');
  Object.entries({client_id:DBX_ID,response_type:'code',code_challenge:ch,code_challenge_method:'S256',redirect_uri:dbxRedirect(),token_access_type:'offline'}).forEach(([k,v])=>u.searchParams.set(k,v));
  location.href=u.toString();
}
async function dbxFinish(code){
  try{const r=await(await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({code,grant_type:'authorization_code',client_id:DBX_ID,redirect_uri:dbxRedirect(),code_verifier:localStorage.getItem('lately-dropbox-verifier')||''})})).json();
    if(r.refresh_token){localStorage.setItem(DBX_OWN,r.refresh_token); dbxTok=r.access_token; dbxExp=Date.now()+r.expires_in*1000; toast('Dropbox is verbonden');}
    else toast('Dropbox verbinden lukte niet: '+(r.error_description||r.error||'onbekend'));
  }catch(e){toast('Dropbox verbinden lukte niet');}
  localStorage.removeItem('lately-dropbox-verifier');
}
async function hrPull(){ if(Array.isArray(hrRead('huisritme-tasks'))||!dbxRT()) return; const hr=await dbxDown('/huisritme-data.json'); if(hr&&hr.tasks){S.hrCache={tasks:hr.tasks,awayPeriods:hr.awayPeriods,wakeTime:hr.wakeTime,bedTime:hr.bedTime,at:Date.now()}; save(true);} }
let dbxTok=null,dbxExp=0,dbxTimer=null; let DBX={state:'uit',at:0};
async function dbxToken(){
  if(dbxTok&&Date.now()<dbxExp-60000) return dbxTok;
  const rt=dbxRT(); if(!rt){DBX.state='geen';return null;}
  try{const r=await(await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({refresh_token:rt,grant_type:'refresh_token',client_id:DBX_ID})})).json();
    if(r.access_token){dbxTok=r.access_token;dbxExp=Date.now()+r.expires_in*1000;return dbxTok;}}catch(e){}
  DBX.state='fout'; return null;
}
async function dbxDown(path){const t=await dbxToken(); if(!t) return undefined;
  try{const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+t,'Dropbox-API-Arg':JSON.stringify({path})}});
    if(r.status===409) return null; if(!r.ok) return undefined; return await r.json();}catch(e){return undefined;}}
async function dbxUp(path,obj){const t=await dbxToken(); if(!t) return false;
  try{const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path,mode:'overwrite',mute:true})},body:JSON.stringify(obj)});
    return r.ok;}catch(e){return false;}}
function dbxSoon(){ if(!dbxRT()) return; clearTimeout(dbxTimer);
  dbxTimer=setTimeout(async()=>{DBX.state='bezig'; const ok=await dbxUp(DBX_FILE,S); DBX.state=ok?'bewaard':'fout'; DBX.at=Date.now();},4000); }
async function dbxStart(){
  const code=new URLSearchParams(location.search).get('code'); if(code&&localStorage.getItem('lately-dropbox-verifier')){ history.replaceState({},'',location.pathname); await dbxFinish(code); }
  if(!dbxRT()){DBX.state='geen';return;}
  const remote=await dbxDown(DBX_FILE);
  if(remote&&remote.blocks&&(remote.updatedAt||0)>(S.updatedAt||0)){ S=remote; fill(); save(true); toast('Je gegevens uit Dropbox zijn geladen'); render(); }
  await hrPull();
  DBX.state='bewaard'; DBX.at=Date.now(); render();
  if(remote===null) dbxSoon();
}

async function api(path,opt){

  if(!r.ok){let m='fout '+r.status;try{m=(await r.json()).error||m;}catch(e){} throw new Error(m);} return r.json();

async function fetchSigs(){ if(!linked()) return; try{const r=await api('/sigs?since='+(S.sigSince||0)); for(const g of r.sigs||[]) processSig(g); if((r.sigs||[]).length) save();}catch(e){} }
function processSig(g){
  S.sigSince=Math.max(S.sigSince||0,g.ts); const d=new Date(g.ts), date=dstr(d), t=tstr(d);
  if(g.t==='bed'){ const h=d.getHours(); if(h>=6&&h<21){ S.sigSince=Math.max(S.sigSince||0,g.ts); return; } // oplader overdag telt niet
    const night=h<12?addDays(date,-1):date; (S.sleep[night]=S.sleep[night]||{}).bed=t; }
  else if(g.t==='wake'){ const night=addDays(date,-1); const s=(S.sleep[night]=S.sleep[night]||{}); if(!s.wake) s.wake=t; }
  else if(g.t==='leave'&&(!g.n||/^thuis$/i.test(g.n.trim()))){ startOut(g.ts,'opdracht'); }
  else if(g.t==='arrive'&&/^thuis$/i.test((g.n||'').trim())){ endOut(g.ts,'opdracht'); }
  else if(g.t==='arrive'&&g.n){ const n=aliasOf(g.n); ensureAct(n); const o=curOut(); if(o&&!o.where.includes(n)) o.where.push(n);
    const ev={id:uid(),kind:'deed',ts:date+'T'+t,date,acts:[n],love:[],when:'nu',src:'plek'}; attachDeed(ev); S.events.push(ev); }
  S.places.push({t:g.t,n:g.n||'',ts:g.ts}); S.places=S.places.slice(-300);
}
function bedOf(night){ const s=S.sleep[night]; if(!s||!s.bed) return null; const fix=t=>{const m=mins(t);return m<720?m+1440:m;};
  const late=[...entriesOn(night).filter(e=>mins(e.time)>=21*60).map(e=>e.time),...entriesOn(addDays(night,1)).filter(e=>mins(e.time)<240).map(e=>e.time)];
  return late.reduce((b,t)=>fix(t)>fix(b)?t:b,s.bed); }
function learnedSleep(){ const ns=Object.entries(S.sleep).sort().slice(-21).map(([n,v])=>({...v,bed:bedOf(n)}));
  const fix=t=>{const m=mins(t);return m<12*60?m+1440:m;};
  const b=median(ns.filter(x=>x.bed).map(x=>fix(x.bed))), w=median(ns.filter(x=>x.wake).map(x=>mins(x.wake)));
  return {bed:b!=null?mt(b%1440):null,wake:w!=null?mt(w):null,n:ns.length}; }

const b64ToU8=b=>{const p='='.repeat((4-b.length%4)%4);const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));};
async function enablePush(){
  if(!linked()) return toast('Vul eerst het adres en de sleutel in');
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return toast('Meldingen werken alleen als Lately op je beginscherm staat (Deel → Zet op beginscherm)');

/* ---- Terugblik op je week ---- */
function weekReview(end){
  end=end||today(); const days=[...Array(7)].map((_,i)=>addDays(end,i-6)); const an=analysis();
  const done=days.flatMap(d=>doneToday(d)); const names=done.map(([n])=>n);
  const rest=names.filter(isRest).length; const cnt={}; names.forEach(n=>cnt[n]=(cnt[n]||0)+1);
  const es=days.flatMap(d=>entriesOn(d)); const zs=es.map(pos).filter(Boolean);
  const heavy=zs.filter(z=>z.zone==='rl').length, green=zs.filter(z=>z.zone==='g').length;
  const good=days.reduce((h,d)=>h+goodHours(entriesOn(d)),0);
  const costSet=new Set(an.acts.filter(a=>a.eff<-3).map(a=>a.n)), gainSet=new Set(an.acts.filter(a=>a.eff>3).map(a=>a.n));
  const NOT=/sleep|slaap|night|nacht|evening|morning|ochtend|avond|wake/i;
  const costs=Object.keys(cnt).filter(n=>costSet.has(n)&&!NOT.test(n)).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);
  const gains=Object.keys(cnt).filter(n=>(gainSet.has(n)||isRest(n))&&!NOT.test(n)).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);
  const asks=S.events.filter(e=>e.kind==='tussen'&&days.includes(e.date));
  const per=days.map(d=>{const z=entriesOn(d).map(pos).filter(Boolean);if(!z.length)return '';const r=z.filter(x=>x.zone==='rl'||x.zone==='rr').length/z.length,g=z.filter(x=>x.zone==='g').length/z.length;return r>=.5?'zr':g>=.5?'zg':'zo';});
  let t=`Je hebt deze week ${done.length} ${done.length===1?'ding':'dingen'} gedaan, en daar zat ${rest} keer rust tussen. `;
  t+=rest>=7?'Dat is goed voor jezelf zorgen, ook als het niet zo voelde. ':rest>0?'Elke keer rust telt. ':'Er zat weinig rust in. Volgende week mag dat best wat meer. ';
  if(heavy) t+=`Er waren ${heavy} zware momenten${green?`, en ${green} keer zat je op je plek`:''}. `; else if(green) t+=`${green} keer zat je op je plek. `;
  if(costs.length) t+=`Wat je vooral energie kostte: ${joinNice(costs,'en')}. `;
  if(gains.length) t+=`Wat je hielp: ${joinNice(gains,'en')}. `;
  if(asks.length) t+=`Het was een paar dagen stiller, en dat is oké. `;
  t+='Je hebt het gedaan. Niet perfect, wel echt.';
  return {t,days,per,good:Math.round(good),done:done.length,rest,top:Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10)};
}

    <div class="card"><h3>Zo liep het</h3><div class="week">${w.days.map((d,i)=>`<div><i class="${w.per[i]}"></i><span class="muted">${DAG[new Date(d+'T12:00').getDay()].slice(0,2)}</span></div>`).join('')}</div><p class="muted">${w.done} dingen gedaan · ${w.rest}× rust · ongeveer ${w.good} goede uren</p></div>

function titleStats(t){const r=Object.values(S.ratings).filter(x=>x.title===t);const c={'-1':0,'0':0,'1':0};r.forEach(x=>c[x.v]++);return {n:r.length,c};}
function autoRating(t){const {n,c}=titleStats(t); if(n<4) return null; for(const v of ['-1','0','1']) if(c[v]/n>=.75) return +v; return null;}
function skipTitles(){return [...new Set([...Object.values(S.ratings).map(x=>x.title).filter(t=>autoRating(t)!=null),...(S.cal.events||[]).map(e=>e.title).filter(calIgnored)])];}
function rate(id,v,title,date){
  S.ratings[id]={v,title,date}; const a=ensureAct(title); const st=titleStats(title);
  if(a.feelAuto!==false){ const m=st.c['1']>st.c['-1']&&st.c['1']>=st.c['0']?1:st.c['-1']>st.c['1']&&st.c['-1']>=st.c['0']?-1:0; a.feel=m; a.feelAuto=true; }
  if(v===-1&&(a.spoon==null||a.spoonAuto)){a.spoon=-2;a.spoonAuto=true;} if(v===1&&(a.spoon==null||a.spoonAuto)){a.spoon=1;a.spoonAuto=true;}
  save(); pushConfig();
}

// Loopt de klok van de hulp? (die stuurt je herinneringen)
let HULP=null;
async function checkHulp(force){ try{ HULP=await api('/ping'+(force?'?force=1':'')); HULP.seen=Date.now(); }catch(e){ HULP={err:true,seen:Date.now()}; } if(TAB==='vandaag'||TAB==='instellingen') render(); }
function hulpState(){ if(!HULP||HULP.err||!S.link.push) return null; const age=HULP.beat?(Date.now()-HULP.beat)/60e3:Infinity; const c=HULP.cron||{};
  if(age<=15) return {ok:true,txt:'De klok loopt'+(HULP.beat?' (laatst om '+tstr(new Date(HULP.beat))+')':'')+'.'+(c.state==='geen-token'?' Zonder CF_TOKEN kan hij zichzelf niet terugzetten als Cloudflare hem weghaalt.':c.state==='fout'?' Zelf terugzetten lukt niet: '+c.err+'.':' Verdwijnt hij, dan zet de hulp hem zelf terug.')};
  if(c.state==='hersteld'||c.state==='ok') return {ok:false,fixed:true,txt:'De klok van je hulp was weg. Hij is net teruggezet, je herinneringen komen weer.'};
  if(c.state==='geen-token') return {ok:false,txt:'Je herinneringen lopen niet: de klok (cron) in Cloudflare is weg. Zet hem terug, of geef de hulp een CF_TOKEN zodat hij dat zelf doet.'};
  return {ok:false,txt:'Je herinneringen lopen niet: de klok (cron) in Cloudflare is weg.'+(c.err?' Zelf terugzetten lukte niet ('+c.err+').':'')}; }
function linksHTML(){
  const hrN=hrTasks().length, hrLocal=Array.isArray(hrRead('huisritme-tasks')); const hasDbx=!!dbxRT();
  const url=S.link.url.replace(/\/+$/,''), k=encodeURIComponent(S.link.key||'');
  const sl=learnedSleep();
  return `<p class="muted">Lately vult zoveel mogelijk zelf in. Hier zie je wat er gekoppeld is.</p>
   ${(()=>{const hs=hulpState(); return hs?`<div class="kv"><b>Herinneringen</b><span class="muted" style="text-align:right;max-width:65%">${esc(hs.txt)}</span></div>`:'';})()}
   <div class="kv"><b>Dropbox</b><span class="muted">${hasDbx?({bewaard:'bewaard'+(DBX.at?' om '+tstr(new Date(DBX.at)):''),bezig:'bezig…',fout:'lukte niet',uit:'verbonden'}[DBX.state]||'verbonden'):'nog niet verbonden'}</span></div>
   ${hasDbx?'':'<button class="btn" id="dbxBtn">Verbind met Dropbox</button><p class="muted">Log in met dezelfde Dropbox als Huisritme. Dan bewaart Lately je gegevens daar en haalt het je Huisritme-taken op.</p>'}
   <div class="kv"><b>Huisritme</b><span class="muted">${hrN?`${hrN} taken ${hrLocal?'op dit apparaat':'via Dropbox'}${S.hrCache&&S.hrCache.at&&!hrLocal?' · '+tstr(new Date(S.hrCache.at)):''}`:(hasDbx?'nog niks gevonden in Dropbox':'verbind eerst Dropbox')}</span></div>
   ${hasDbx&&!hrN?'<p class="muted">Open Huisritme en kijk of daar Dropbox verbonden is. Huisritme moet zijn taken eerst naar Dropbox sturen.</p>':''}
   <h3>Cloudflare-hulpje</h3><p class="muted">Voor meldingen, je agenda en Opdrachten. De uitleg staat in je stap-voor-stap document.</p>
   <label>Adres van je hulpje<input type="text" id="lUrl" placeholder="https://lately-hulp.jouwnaam.workers.dev" value="${esc(S.link.url)}"></label>
   <label>Je sleutel (APP_KEY)<input type="text" id="lKey" value="${esc(S.link.key)}" autocomplete="off"></label>
   <div class="row wrap"><button class="btn small" id="lSave">Opslaan en testen</button>${linked()?`<button class="btn ghost small" id="lPush">${S.link.push?'Meldingen opnieuw aanzetten':'Meldingen aanzetten'}</button><button class="btn ghost small" id="lTest">Testmelding</button>`:''}</div>
   <p class="muted" id="lStat">${linked()?(S.cal.at?`Agenda opgehaald om ${tstr(new Date(S.cal.at))}: ${(S.cal.events||[]).length} afspraken.`:'Nog geen agenda opgehaald.')+(S.cal.err?' Laatste fout: '+esc(S.cal.err):''):'Nog niet gekoppeld.'}</p>
   <h3>Seintje op zware dagen</h3><p class="muted">Was je dag zwaarder dan normaal? Dan krijg je een zacht seintje om op tijd naar bed te gaan. Zet de tijd vóór je stille modus.</p>
   <div class="row"><button class="chip ${S.settings.nudge.on?'on':''}" id="nuOn">${S.settings.nudge.on?'aan':'uit'}</button><input type="time" id="nuT" value="${S.settings.nudge.time}" style="width:120px"></div>
   <h3>Tweede herinnering</h3><p class="muted">Nog niet ingecheckt? Dan nog één zacht seintje, zoveel minuten na je herinnering. Niet na je laatste herinnering van de dag.</p>
   <div class="row"><button class="chip ${S.settings.second.on?'on':''}" id="seOn">${S.settings.second.on?'aan':'uit'}</button><select id="seM" style="width:140px">${[30,45,60].map(m=>`<option value="${m}" ${S.settings.second.after===m?'selected':''}>na ${m} minuten</option>`).join('')}</select></div>
   <h3>Terugblik op je week</h3><p class="muted">Op zondag een melding dat je week klaarstaat.</p>
   <div class="row"><button class="chip ${S.settings.week.on?'on':''}" id="wkOn">${S.settings.week.on?'aan':'uit'}</button><input type="time" id="wkT" value="${S.settings.week.time}" style="width:120px"></div>
   <h3>Niet meetellen uit je agenda</h3><p class="muted">Afspraken met deze woorden in de titel tellen niet mee en krijgen geen melding (bijvoorbeeld de Picnic-recepten voor Jordy).</p>
   <div class="chips" id="igL">${(S.calIgnore||[]).map((w,i)=>`<button class="chip on" data-i="${i}">${esc(w)} ✕</button>`).join('')}</div>
   <div class="row"><input type="text" id="igN" class="grow" placeholder="woord, bijv. recept"><button class="btn ghost small" id="igA">+ Toevoegen</button></div>
   ${linked()?`<h3>Opdrachten (slaap en plekken)</h3><p class="muted">Maak in de Opdrachten-app per automatisering de actie "Haal inhoud van URL op" met deze adressen. Kies bij elke automatisering "Voer direct uit".</p>
   <label>Naar bed (oplader wordt aangesloten). Lately telt het alleen na 21:00, en als je daarna nog incheckt telt die tijd.<input type="text" readonly value="${esc(url)}/sig?k=${k}&t=bed" onclick="this.select()"></label>
   <label>Opgestaan (wekker gestopt)<input type="text" readonly value="${esc(url)}/sig?k=${k}&t=wake" onclick="this.select()"></label>
   <label>Van huis vertrokken (Automatisering → Vertrek → Thuis). Lately zet je dan op buiten de deur.<input type="text" readonly value="${esc(url)}/sig?k=${k}&t=leave&n=thuis" onclick="this.select()"></label>
   <label>Thuisgekomen (Automatisering → Aankomst → Thuis)<input type="text" readonly value="${esc(url)}/sig?k=${k}&t=arrive&n=thuis" onclick="this.select()"></label>
   <p class="muted">Korter dan 5 minuten weg telt niet. Vergeet Opdrachten iets, dan kun je het op Vandaag met de knop aanpassen.</p>
   <label>Aangekomen bij een andere plek (vervang school door de plek)<input type="text" readonly value="${esc(url)}/sig?k=${k}&t=arrive&n=school" onclick="this.select()"></label>
   <p class="muted">${sl.n?`Geleerd uit ${sl.n} nachten: meestal naar bed rond ${sl.bed||'?'}, op rond ${sl.wake||'?'}.`:'Nog geen nachten binnen.'}</p>`:''}`;
}
function bindLinks(){
  const db=document.getElementById('dbxBtn'); if(db) db.onclick=dbxConnect;
  document.querySelectorAll('#igL .chip').forEach(c=>c.onclick=()=>{S.calIgnore.splice(+c.dataset.i,1);save();pushConfig();vInst();});
  const upd=()=>{S.nudgeSent=null; save(); syncNudge(); vInst();};
  const nO=document.getElementById('nuOn'); if(nO){ nO.onclick=()=>{S.settings.nudge.on=!S.settings.nudge.on;upd();}; document.getElementById('nuT').onchange=e=>{S.settings.nudge.time=e.target.value;upd();};
    document.getElementById('seOn').onclick=()=>{S.settings.second.on=!S.settings.second.on;save();pushConfig();vInst();}; document.getElementById('seM').onchange=e=>{S.settings.second.after=+e.target.value;save();pushConfig();};
    document.getElementById('wkOn').onclick=()=>{S.settings.week.on=!S.settings.week.on;upd();}; document.getElementById('wkT').onchange=e=>{S.settings.week.time=e.target.value;upd();}; }
  const ia=document.getElementById('igA'); if(ia) ia.onclick=()=>{const w=document.getElementById('igN').value.trim(); if(!w) return; S.calIgnore.push(w); save(); pushConfig(); vInst();};
  const s=document.getElementById('lSave'); if(!s) return;
  s.onclick=async()=>{S.link.url=document.getElementById('lUrl').value.trim(); S.link.key=document.getElementById('lKey').value.trim(); save(); await saveSwConfig();
    try{const r=await api('/ping'); toast(r.agenda?'Gekoppeld, agenda gevonden':'Gekoppeld (nog geen agenda-link)'); await pushConfig(); await fetchCal(); await fetchSigs(); vInst();}catch(e){toast('Koppelen lukte niet: '+e.message);}};
  const p=document.getElementById('lPush'); if(p) p.onclick=enablePush;
  const t=document.getElementById('lTest'); if(t) t.onclick=async()=>{try{await api('/test'); toast('Testmelding verstuurd');}catch(e){toast('Lukte niet: '+e.message);}};
}
let linkTimer=null;
function startLinks(){
  const r=hrRhythm(); if(r&&!S.week.fromUser){ if(r.wake) S.week.wake=r.wake; if(r.bed) S.week.bed=r.bed; }
  dbxStart(); fetchCal(); fetchSigs(); saveSwConfig(); fetchWx().then(()=>render());
  clearInterval(linkTimer); linkTimer=setInterval(()=>{ if(document.visibilityState==='visible'){fetchCal();fetchSigs();hrPull();} },10*60000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(Date.now()-(S.cal.at||0)>5*60000) fetchCal(); fetchSigs(); fetchWx(); hrPull().then(render); render(); } });
}

/* ---------- Start ---------- */
migrateGroups(); reassignBlocks(); cleanV6(); save();
render(); setInterval(applyTheme,60000);
// Stuur je herinneringen bij elke keer openen naar de hulp, zodat die altijd weet wanneer hij je moet seinen.
setTimeout(()=>{ if(linked()){ pushConfig(); checkHulp(); } },1500); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&linked()){ pushConfig(); checkHulp(); } });
{const qs=new URLSearchParams(location.search); const ci=qs.get('checkin'), ra=qs.get('rate'), wk=qs.get('week'); if(ci||ra||wk) history.replaceState({},'',location.pathname); if(wk) setTimeout(openWeek,400);
  if(ci) setTimeout(()=>openCheckin(S.blocks.find(b=>b.id===ci)?ci:undefined),250); if(ra) setTimeout(()=>openRate(ra),400);}
startLinks();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
